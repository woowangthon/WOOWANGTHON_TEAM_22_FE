  // flow: {chat, sessionId, revision, phase:'sketch'|'review', draftReq, draft, draftBusy, draftErr, sessionLost,
  //        blob, blobUrl, weather, confirmReq, saving, saveErr, diary, uploading, upErr,
  //        drawState: null|'checking'|'pending'|'exists' (409 이후 서버 그림 상태), serverImage}
  let flow = null;
  function startFlow(c){
    if(hasUnknown(c)) return;            // 미해결 세션은 초안 진입 금지
    flow = {chat:c, sessionId:c.sessionId, revision:c.revision, phase:'sketch', draft:null, draftReq:null, draftBusy:false, draftErr:null,
            sessionLost:false, blob:null, blobUrl:null, weather:null, confirmReq:null, saving:false, saveErr:null, diary:null, uploading:false, upErr:null,
            drawState:null, serverImage:null};
    updateShelf();
    requestDraft(flow, false);           // 그림을 그리는 동안 초안을 미리 받아 둠
  }
  function resumeFlow(opener){
    if(flow.phase === 'sketch') openSketch(); else openReview(opener);
  }
  // 초안: 결과를 모르는 실패는 같은 client_request_id로, 확실히 실패했으면 사용자가 눌러 새 ID로 다시 만듦 (BE 허용)
  // AI_OUTCOME_UNKNOWN은 예외: 새 ID 재생성 금지, 같은 ID로 상태 확인만
  async function requestDraft(f, fresh){
    if(f.draftBusy || f.draft) return;
    if(hasUnknown(f.chat)){ toast(UNKNOWN_BLOCK); return; }   // 미확정 발언 누락 초안 방지
    if(!f.draftReq || fresh) f.draftReq = {client_request_id: rid('draft'), history_revision: f.revision};
    const req = f.draftReq;
    f.draftBusy = true; f.draftErr = null; renderReview();
    try{
      const r = await api(`/api/chat-sessions/${encodeURIComponent(f.sessionId)}/diary-draft`, {method:'POST', json:req, timeout:AI_TIMEOUT});
      if(f !== flow || req !== f.draftReq || r.history_revision !== f.revision) return;   // 늦은 이전 응답은 버림
      f.draft = r.draft;
    }catch(e){
      if(f !== flow || req !== f.draftReq) return;
      if(e.code === 'SESSION_NOT_FOUND') f.sessionLost = true;
      f.draftErr = e; handleAuth(e);
    }finally{
      if(f === flow && req === f.draftReq){ f.draftBusy = false; renderReview(); }
    }
  }
  // 확정 저장: 요청 본문은 처음 한 번만 만들고, 재시도는 같은 키·같은 본문으로만
  async function confirmDiary(f){
    if(f.saving || f.diary || !f.draft) return;
    if(hasUnknown(f.chat)){ toast(UNKNOWN_BLOCK); return; }
    if(!f.confirmReq){
      const body = {client_request_id: rid('confirm'), history_revision: f.revision, draft_id: f.draft.draft_id};
      if(f.weather) body.weather = f.weather;
      f.confirmReq = body;
    }
    f.saving = true; f.saveErr = null; renderReview();
    try{
      const det = await api(`/api/chat-sessions/${encodeURIComponent(f.sessionId)}/diaries`, {method:'POST', json:f.confirmReq, timeout:SAVE_TIMEOUT});
      if(f !== flow) return;
      f.diary = det; putDiaryItem(det);
    }catch(e){
      if(f !== flow) return;
      f.saving = false;
      if(e.code === 'DIARY_DATE_CONFLICT'){          // 이미 오늘 일기가 있음 → 그 일기를 보여 줌
        toast('오늘 일기가 이미 있어요'); endFlow();
        loadMonth(today.y, today.m, true);
        closeBook(()=> openCalendarPage(shelf));
        return;
      }
      if(e.code === 'SESSION_NOT_FOUND') f.sessionLost = true;
      else if(e.code === 'HISTORY_REVISION_CONFLICT' || e.code === 'DIARY_DRAFT_NOT_FOUND'){   // 초안이 바뀜 → 다시 확인받기
        f.draft = null; f.confirmReq = null; requestDraft(f, true);
      }else f.saveErr = e;
      toast('저장 실패: ' + errText(e)); handleAuth(e);
      renderReview();
      return;
    }
    f.saving = false;
    uploadDrawing(f);
  }
  // 그림 업로드: diary_id를 받은 뒤에만. 실패하면 같은 diary_id·같은 Blob으로만 다시 시도
  async function uploadDrawing(f){
    if(f !== flow || f.uploading || f.drawState) return;
    if(!f.blob){ finishFlow(f); return; }            // 그린 그림이 없으면 일기만 저장
    f.uploading = true; f.upErr = null; renderReview();
    let ok = false, conflict = false;
    try{
      const form = new FormData(); form.append('file', f.blob, f.blob.type === 'image/jpeg' ? 'drawing.jpg' : 'drawing.png');
      await api(`/api/diaries/${encodeURIComponent(f.diary.diary_id)}/drawing`, {method:'POST', form, timeout:SAVE_TIMEOUT});
      ok = true;
    }catch(e){
      if(e.code === 'DRAWING_ALREADY_EXISTS') conflict = true;   // 409: 성공 아님, 서버 상태 확인
      else { f.upErr = e; toast('그림 ' + errText(e)); handleAuth(e); }
    }
    if(f !== flow) return;
    f.uploading = false;
    if(ok) finishFlow(f); else if(conflict) checkDrawing(f); else renderReview();
  }
  // 409 이후 상세 GET으로 서버 그림 상태 확인 (재업로드 없음, Blob·diary_id 보존)
  async function checkDrawing(f){
    if(f !== flow || f.drawState === 'checking') return;
    f.drawState = 'checking'; renderReview();
    let state = 'pending', url = null;
    try{
      const det = await api('/api/diaries/' + encodeURIComponent(f.diary.diary_id));
      const a = (det.assets || []).find(x => x.asset_kind === 'original_drawing' && x.imageUrl);
      url = (a && a.imageUrl) || det.imageUrl || null;
      if(url) state = 'exists';
      toast(url ? '이미 저장된 그림 있음 · 확인 필요' : '그림 저장 대기 · 완료 불가');
    }catch(e){
      toast('그림 상태 ' + errText(e)); handleAuth(e);
    }
    if(f !== flow) return;
    f.drawState = state; f.serverImage = url;
    if(reviewing) setPicture(state === 'exists' ? {drawing:url, diaryId:f.diary.diary_id} : {drawing:f.blobUrl});
    renderReview();
  }
  function endFlow(){
    if(flow && flow.blobUrl){ const u = flow.blobUrl; setTimeout(()=> URL.revokeObjectURL(u), 3000); }
    flow = null; chat = null; updateShelf();
  }
  // 저장이 모두 끝남 → 달력을 열고 오늘의 그림일기를 BE에서 다시 불러와 펼침
  function finishFlow(f){
    if(f !== flow) return;
    const d = f.diary; endFlow();
    const [y, m, dd] = String(d.diary_date).split('-').map(Number);
    const after = ()=>{
      openCalendarPage(shelf, y, m); toast('그림일기를 완성했어요');
      setTimeout(()=>{ if(!calpage.hidden && !bookShown() && viewY === y && viewM === m) openDiaryAt(y, m, dd, bigGrid.cells[dd], d.diary_id); }, reduce ? 0 : 800);
    };
    bookShown() ? closeBook(after) : after();
  }

  // 저장 전 확인 화면: 그림일기 양식에 초안 글·그림·날씨를 보여 줌
  const saveBtn = document.getElementById('saveBtn'), redrawBtn = document.getElementById('redrawBtn');
  function openReview(opener){
    const f = flow; if(!f || bookShown()) return;
    diaryDate = new Date(today.y, today.m - 1, today.d);
    diaryEntries = f.chat.entries.filter(en => en.state === 'sent');
    openBook('diary', fmtDate(today.y, today.m, today.d), opener || shelf, f.chat.color,
      f.drawState === 'exists' ? {weather:f.weather, drawing:f.serverImage, diaryId:f.diary.diary_id, diary:'', name:userName()}
                               : {weather:f.weather, drawing:f.blobUrl, diary:'', name:userName()}, true);
  }
  function renderReview(){
    const f = flow; if(!reviewing || !f) return;
    if(f.draft) setDiaryText(f.draft.text, false);
    else if(outcomeUnknown(f.draftErr)) setDiaryText('초안 결과 불명 · 새 요청 불가', true);
    else if(f.draftErr) setDiaryText('초안 실패: ' + errText(f.draftErr, 'AI 응답 실패'), true);
    else setDiaryText('AI가 일기 초안을 쓰고 있어요…', true);
    redrawBtn.hidden = !!f.confirmReq || f.sessionLost;     // 저장을 시작한 뒤에는 그림을 바꾸지 않음 (같은 그림으로만 재시도)
    let label = '이대로 저장', dis = false;
    if(f.sessionLost){ label = '새 대화 시작'; }
    else if(f.uploading){ label = '그림 저장 중…'; dis = true; }
    else if(f.saving){ label = '저장 중…'; dis = true; }
    else if(f.drawState === 'checking'){ label = '그림 상태 확인 중…'; dis = true; }
    else if(f.drawState === 'pending'){ label = '그림 상태 다시 확인'; }
    else if(f.drawState === 'exists'){ label = '저장된 그림으로 완료'; }
    else if(f.diary){ label = '그림 저장 다시 시도'; }
    else if(!f.draft){
      label = !f.draftErr ? '초안 기다리는 중' : outcomeUnknown(f.draftErr) ? '초안 상태 다시 확인' : '초안 다시 요청';
      dis = !f.draftErr;
    }
    else if(f.saveErr){ label = '저장 다시 시도'; }
    saveBtn.textContent = label; saveBtn.disabled = dis;
  }
  saveBtn.addEventListener('click', e=>{
    e.stopPropagation();
    const f = flow; if(!f) return;
    if(f.sessionLost){ restartChat(); return; }
    if(f.diary){
      if(f.drawState === 'exists'){ finishFlow(f); return; }      // 사용자 확인 후에만 완료
      if(f.drawState === 'pending'){ checkDrawing(f); return; }   // 상세 GET만, 재업로드 없음
      if(!f.drawState) uploadDrawing(f);
      return;
    }
    if(!f.draft){   // 결과 불명은 같은 ID로만 확인
      if(f.draftErr && !f.draftBusy) requestDraft(f, !sameIdRetry(f.draftErr) && !outcomeUnknown(f.draftErr));
      return;
    }
    confirmDiary(f);
  });
  redrawBtn.addEventListener('click', e=>{
    e.stopPropagation();
    if(!flow || flow.confirmReq) return;
    flow.phase = 'sketch';
    closeBook(()=> openSketch());
  });

  // ---- 달력: 서울 기준 이번 달(벽), 확대 달력은 달을 넘겨 볼 수 있음 ----
  const calpage = document.getElementById('calpage'), bigcal = document.getElementById('bigcal'), bigGrid = document.getElementById('bigGrid');
  const homeCal = document.getElementById('homeCal'), homeGrid = document.getElementById('calGrid');
  const BOOK_ICON = document.getElementById('bookIcon').innerHTML;
  let homeY = 0, homeM = 0, viewY = today.y, viewM = today.m;
  const headHTML = (y, m) => `<b>${m}</b><small>${MON[m-1]}<br>${y}</small>`;
  // 달력 칸 만들기 (big: 확대 달력의 누를 수 있는 칸)
  function buildGrid(el, y, m, big){
    el.innerHTML = ''; el.cells = {}; el.ym = [y, m];
    WD.forEach((d,i)=>{ const w = document.createElement('div'); w.className = 'cal-dow' + (i===0?' sun':''); w.textContent = d; el.appendChild(w); });
    const first = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate();
    for(let i=0;i<first;i++){ const e = document.createElement('span'); e.className = big ? 'cell empty' : 'day empty'; el.appendChild(e); }
    for(let d=1; d<=days; d++){
      const sun = (first + d - 1) % 7 === 0, td = isToday(y, m, d);
      let c;
      if(big){
        c = document.createElement('button'); c.type = 'button';
        c.className = 'cell' + (sun?' sun':'') + (td?' today':'');
        c.innerHTML = `<span class="num">${d}</span>`;
        c.addEventListener('click', ()=> openDiaryAt(y, m, d, c));
      }else{
        c = document.createElement('span'); c.className = 'day' + (sun?' sun':'') + (td?' today':''); c.textContent = d;
      }
      el.appendChild(c); el.cells[d] = c;
    }
    markGrid(el);
  }
  // 일기가 있는 날에 책 아이콘
  function markGrid(el){
    if(!el.ym) return;
    const [y, m] = el.ym, mo = months[ymKey(y, m)];
    for(const [d, c] of Object.entries(el.cells)){
      const it = mo && mo.byDay[d], has = !!it;
      c.classList.toggle('has-diary', has);
      let mark = c.querySelector('.bookmark');
      if(has && !mark){ mark = document.createElement('span'); mark.className = 'bookmark'; mark.innerHTML = BOOK_ICON; c.appendChild(mark); }
      if(!has && mark){ mark.remove(); mark = null; }
      if(mark) mark.style.setProperty('--cover', `var(--${colorOf(it.diary_id)})`);
      if(c.tagName === 'BUTTON') c.setAttribute('aria-label', `${m}월 ${d}일 (${WD[new Date(y, m-1, +d).getDay()]})` + (isToday(y, m, +d)?', 오늘':'') + (has?', 그림일기 있음':''));
    }
  }
  function refreshMonthViews(y, m){
    if(homeGrid.ym && homeGrid.ym[0] === y && homeGrid.ym[1] === m) markGrid(homeGrid);
    if(bigGrid.ym && bigGrid.ym[0] === y && bigGrid.ym[1] === m){
      markGrid(bigGrid);
      const mo = months[ymKey(y, m)];
      bigcal.classList.toggle('loading', !!mo && mo.state === 'loading');
    }
    if(y === today.y && m === today.m) updateShelf();
  }
  // 벽 달력: 서울 기준 이번 달 (날이 바뀌면 다시 그림)
  function renderHome(){
    today = seoulToday();
    if(homeY === today.y && homeM === today.m && homeGrid.querySelector('.today')) return;
    homeY = today.y; homeM = today.m;
    document.getElementById('homeHead').innerHTML = headHTML(homeY, homeM);
    homeCal.setAttribute('aria-label', `일기 확인: ${homeY}년 ${homeM}월 달력 열기`);
    buildGrid(homeGrid, homeY, homeM, false);
  }
  function showMonth(y, m){
    viewY = y; viewM = m;
    document.getElementById('bigHead').innerHTML = headHTML(y, m);
    document.getElementById('bigcalTitle').textContent = `${y}년 ${m}월`;
    buildGrid(bigGrid, y, m, true);
    bigcal.classList.remove('loading');
    loadMonth(y, m);
  }
  function stepMonth(n){
    let y = viewY, m = viewM + n;
    if(m < 1){ m = 12; y--; } if(m > 12){ m = 1; y++; }
    showMonth(y, m);
  }
  document.getElementById('calPrev').addEventListener('click', ()=> stepMonth(-1));
  document.getElementById('calNext').addEventListener('click', ()=> stepMonth(1));
  // 책장 안내 문구
  function updateShelf(){
    const has = !!(user && dayItem(today.y, today.m, today.d));
    const text = flow ? '오늘의 일기 마저 쓰기' : has ? '오늘의 일기 보기' : '오늘의 일기 쓰기';
    shelf.querySelector('.hint').textContent = text;
    shelf.setAttribute('aria-label', text + ': 책장 열기');
  }

  // 날짜를 누르면 그 날의 그림일기를 BE에서 불러와 펼침 (없으면 빈 책)
  let diaryEntries = [];   // 지금 펼친 그림일기를 쓸 때 나눈 대화 (대화 기록 보기에 사용)
  let diarySeq = 0;
  async function openDiaryAt(y, m, d, opener, knownId){
    if(bookShown()) return;
    const it = user ? dayItem(y, m, d) : null, id = knownId || (it && it.diary_id);
    // 저장은 됐지만 그림 업로드를 마치지 못한 오늘 일기 → 다시 시도할 수 있는 확인 화면으로
    if(id && flow && flow.diary && flow.diary.diary_id === id){ openReview(opener); return; }
    const seq = ++diarySeq;
    if(!id){ openDiaryBook(y, m, d, null, opener); return; }
    opener && opener.classList.add('loading');
    try{
      const det = await api('/api/diaries/' + encodeURIComponent(id));
      if(seq !== diarySeq) return;                  // 그 사이 다른 날짜를 눌렀으면 늦은 응답은 버림
      openDiaryBook(y, m, d, det, opener);
    }catch(e){
      if(seq === diarySeq){ toast(errText(e)); handleAuth(e); }
    }finally{ opener && opener.classList.remove('loading'); }
  }
  function openDiaryBook(y, m, d, det, opener){
    // 원본 대화는 position 순서 그대로
    diaryEntries = det ? (det.messages || []).slice().sort((a, b) => a.position - b.position)
      .map(x => ({who: x.role === 'child' ? 'user' : 'ai', text: x.text})) : [];
    diaryDate = new Date(y, m - 1, d);
    const bk = det ? {weather:det.weather, drawing:det.imageUrl || null, diary:det.confirmed_text || '', name:userName(), diaryId:det.diary_id} : null;
    openBook('diary', fmtDate(y, m, d), opener, det ? colorOf(det.diary_id) : null, bk);
  }

  // ---- 대화 기록 보기: 이 그림일기를 쓸 때 AI와 나눈 대화를 읽기 전용으로 보여 줌 ----
  const logEl = document.getElementById('chatLog'), logList = document.getElementById('logList');
  const logBtn = document.getElementById('logBtn'), logClose = document.getElementById('logClose');
  function openLog(){
    logList.innerHTML = '';
    document.getElementById('logDate').textContent = chatDate.textContent;
    if(!diaryEntries.length){
      const p = document.createElement('p'); p.className = 'empty-state'; p.textContent = '대화 기록이 없어요.'; logList.appendChild(p);
    }
    diaryEntries.forEach(en=>{
      const el = document.createElement('div');
      el.className = 'msg ' + en.who; el.textContent = en.text;
      logList.appendChild(el);
    });
    logEl.hidden = false;
    requestAnimationFrame(()=>{ logEl.classList.add('show'); logClose.focus({preventScroll:true}); });
  }
  function closeLog(){
    logEl.classList.remove('show');
    setTimeout(()=>{ logEl.hidden = true; if(bookShown()) logBtn.focus({preventScroll:true}); }, reduce ? 0 : 300);
  }
  logBtn.addEventListener('click', e=>{ e.stopPropagation(); openLog(); });
  logClose.addEventListener('click', closeLog);
  logEl.addEventListener('click', e=>{ if(e.target === logEl) closeLog(); });   // 창 바깥을 누르면 닫힘

  // 방의 달력 위치에서 화면 크기로 확대 (FLIP 애니메이션)
  function flipFromHome(reverse){
    const from = homeCal.getBoundingClientRect();
    calpage.hidden = false;
    bigcal.classList.remove('anim'); bigcal.style.transform = '';
    const to = bigcal.getBoundingClientRect();
    const t = `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width}, ${from.height / to.height})`;
    if(!reverse){ bigcal.style.transform = t; }
    void bigcal.offsetWidth;
    bigcal.classList.add('anim');
    bigcal.style.transform = reverse ? t : '';
  }
  let calOpener = null;
  function openCalendarPage(opener, y, m){
    if(!calpage.hidden) return;
    calOpener = opener || homeCal;
    renderHome();
    if(!user) toast('로그인하면 저장한 일기를 볼 수 있어요');
    calpage.classList.toggle('pcal', stage.classList.contains('portrait'));
    showMonth(y || today.y, m || today.m);
    setTimeout(()=>{ homeCal.style.visibility = 'hidden'; }, 30);   // 벽의 달력이 떼어져 확대되는 것처럼
    flipFromHome(false);
    requestAnimationFrame(()=> calpage.classList.add('show'));
    later(()=>{ const t = bigGrid.querySelector('.cell.today') || bigGrid.cells[1]; t && t.focus({preventScroll:true}); }, 700);
  }
  function closeCalendarPage(){
    if(calpage.hidden || calpage.classList.contains('closing')) return;
    calpage.classList.add('closing');          // 줄어드는 동안에도 방의 책장·버튼은 바로 누를 수 있게
    homeCal.classList.add('at-rest');          // 벽 달력의 원래 자리(떠오르지 않은 상태)로 돌아가도록
    flipFromHome(true);
    calpage.classList.remove('show');
    // 책을 여닫을 때 지워지는 later() 타이머가 아니라 따로 둬서, 그 사이 책장을 눌러도 달력 정리가 끝까지 됨
    setTimeout(()=>{ homeCal.style.visibility = ''; homeCal.classList.remove('at-rest'); calpage.hidden = true; calpage.classList.remove('closing'); bigcal.classList.remove('anim'); bigcal.style.transform=''; calOpener && reader.hidden && calOpener.focus({preventScroll:true}); }, reduce ? 0 : 700);
  }
  calpage.addEventListener('click', e=>{ if(e.target === calpage) closeCalendarPage(); });   // 달력 바깥을 누르면 방으로
  homeCal.addEventListener('click', ()=> openCalendarPage(homeCal));
  homeCal.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openCalendarPage(homeCal); }
  });
  document.addEventListener('keydown', e=>{
    if(e.key !== 'Escape') return;
    if(!auth.hidden) closeAuth();                  // 로그인 창이 열려 있으면 그것부터
    else if(!logEl.hidden) closeLog();             // 대화 기록 창이 열려 있으면 그것부터
    else if(!sketch.hidden) return;                // 스케치북은 "그림일기 완성"으로만 닫음 (그리던 그림이 날아가지 않게)
    else if(bookShown()) closeBook();               // 책이 열려 있으면 책부터 닫기
    else if(!calpage.hidden) closeCalendarPage();
  });
  // 로고: 방(책장)으로. Esc와 같은 닫기 함수로 스케치북·달력을 닫음 (flow는 그대로, 책장에서 이어 하기)
  // 책이 열려 있는 동안 로고는 책 아래에 있어 눌리지 않음 (책은 바깥 누르기·Esc로 닫음)
  // 스케치북은 두 번 눌러야 나감: 3초 안에 다시 누르지 않으면 원래대로 (대화 끝내기와 같은 방식)
  let homeArmed = false, homeTimer;
  document.getElementById('logoBtn').addEventListener('click', ()=>{
    if(!auth.hidden){ closeAuth(); return; }           // 로그인 창만 닫음
    if(!sketch.hidden && !homeArmed){
      homeArmed = true; toast('한 번 더 누르면 나가요');
      homeTimer = setTimeout(()=>{ homeArmed = false; }, 3000);
      return;
    }
    clearTimeout(homeTimer); homeArmed = false;
    if(!sketch.hidden) closeSketch();
    if(!calpage.hidden) closeCalendarPage();
  });

  // ---- 로그인 / 회원가입 (Supabase Auth) ----
  // 성공하면 {ok:true, message?}, 실패하면 {ok:false, message:'…'}
  function authErrMsg(e){
    if(e && e.code === 'AUTH_TIMEOUT') return '인증 응답 지연 · 다시 시도해 주세요.';
    const m = (e && e.message) || '';
    if(/invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않아요.';
    if(/email not confirmed/i.test(m)) return '이메일 인증 후 로그인해 주세요.';
    if(/already (registered|been registered|exists)/i.test(m)) return '이미 가입한 이메일이에요.';
    if(e && e.status === 429) return '요청이 많아요. 잠시 후 다시 시도해 주세요.';
    if(/password/i.test(m)) return '비밀번호 조건을 확인해 주세요.';
    if(/fetch|network/i.test(m)) return '서버 연결 실패';
    return '인증 실패';
  }
  const authCall = p => untilDeadline(p, Date.now() + TMO.auth, 'AUTH_TIMEOUT');   // 인증 서버 대기 제한
  async function login(email, password){
    if(!sb) return {ok:false, message:NO_AUTH_MSG};
    const {error} = await authCall(sb.auth.signInWithPassword({email, password}));
    return error ? {ok:false, message:authErrMsg(error)} : {ok:true};
  }
  async function signup(name, email, password){
    if(!sb) return {ok:false, message:NO_AUTH_MSG};
    const {data, error} = await authCall(sb.auth.signUp({email, password, options:{data:{name}}}));
    if(error) return {ok:false, message:authErrMsg(error)};
    // 이메일 인증을 켠 프로젝트는 세션 없이 가입만 됨
    return data && data.session ? {ok:true, message:'가입이 완료됐어요.', session:true} : {ok:true, message:'가입 완료. 이메일 인증 후 로그인해 주세요.'};
  }
  const auth = document.getElementById('auth'), loginForm = document.getElementById('loginForm'), signupForm = document.getElementById('signupForm');
  const tabLogin = document.getElementById('tabLogin'), tabSignup = document.getElementById('tabSignup');
  let authOpener = null;
  function showTab(which){
    const isLogin = which === 'login';
    loginForm.hidden = !isLogin; signupForm.hidden = isLogin;
    tabLogin.setAttribute('aria-selected', String(isLogin)); tabSignup.setAttribute('aria-selected', String(!isLogin));
    const f = (isLogin ? loginForm : signupForm).querySelector('input'); f && f.focus({preventScroll:true});
  }
  function openAuth(which, opener){
    authOpener = opener; auth.hidden = false; showTab(which);
    requestAnimationFrame(()=> auth.classList.add('show'));
  }
  function closeAuth(){
    auth.classList.remove('show');
    setTimeout(()=>{ auth.hidden = true; authOpener && authOpener.focus({preventScroll:true}); }, reduce ? 0 : 300);
  }
  function requireLogin(){ toast('로그인이 필요해요'); openAuth('login', shelf); }
  document.getElementById('openLogin').addEventListener('click', e=> openAuth('login', e.currentTarget));
  document.getElementById('openSignup').addEventListener('click', e=> openAuth('signup', e.currentTarget));
  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    let ok = true;
    if(sb){ try{ await authCall(sb.auth.signOut()); }catch(e){ ok = false; } }
    setUser(null); toast(ok ? '로그아웃했어요' : '인증 응답 지연 · 이 화면에서만 로그아웃');
  });
  tabLogin.addEventListener('click', ()=> showTab('login'));
  tabSignup.addEventListener('click', ()=> showTab('signup'));
  auth.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', ()=> showTab(b.dataset.go)));
  auth.addEventListener('click', e=>{ if(e.target === auth) closeAuth(); });   // 창 바깥을 누르면 닫힘

  const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  function check(msgEl, rules){                    // [입력칸, 통과 여부, 안내 문구] 중 처음 걸리는 것을 알려 줌
    msgEl.classList.remove('ok');
    rules.forEach(([el]) => el && el.removeAttribute('aria-invalid'));
    for(const [el, ok, text] of rules){ if(!ok){ msgEl.textContent = text; if(el){ el.setAttribute('aria-invalid','true'); el.focus({preventScroll:true}); } return false; } }
    msgEl.textContent = ''; return true;
  }
  // 제출 중에는 버튼을 막아 중복 요청 방지
  async function submitOnce(form, fn){
    const btn = form.querySelector('.auth-submit'); if(btn.disabled) return null;
    btn.disabled = true;
    try{ return await fn(); }catch(e){ return {ok:false, message:authErrMsg(e)}; }finally{ btn.disabled = false; }
  }
  loginForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const em = document.getElementById('loginEmail'), pw = document.getElementById('loginPw'), msg = document.getElementById('loginMsg');
    if(!check(msg, [[em, em.value.trim(), '이메일을 입력해 주세요.'], [em, emailOk(em.value.trim()), '이메일 형식을 확인해 주세요.'], [pw, pw.value, '비밀번호를 입력해 주세요.']])) return;
    const r = await submitOnce(loginForm, ()=> login(em.value.trim(), pw.value)); if(!r) return;
    msg.textContent = r.ok ? '로그인했어요.' : r.message; msg.classList.toggle('ok', !!r.ok);
    if(r.ok){ pw.value = ''; setTimeout(closeAuth, 600); }
  });
  signupForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const nm = document.getElementById('suName'), em = document.getElementById('suEmail'), pw = document.getElementById('suPw'), pw2 = document.getElementById('suPw2'), ag = document.getElementById('suAgree'), msg = document.getElementById('signupMsg');
    if(!check(msg, [[nm, nm.value.trim(), '이름을 입력해 주세요.'], [em, emailOk(em.value.trim()), '이메일 형식을 확인해 주세요.'], [pw, pw.value.length >= 8, '비밀번호는 8자 이상이어야 해요.'], [pw2, pw.value === pw2.value, '비밀번호 확인이 일치하지 않아요.'], [ag, ag.checked, '약관에 동의해 주세요.']])) return;
    const r = await submitOnce(signupForm, ()=> signup(nm.value.trim(), em.value.trim(), pw.value)); if(!r) return;
    msg.textContent = r.message; msg.classList.toggle('ok', !!r.ok);
    if(r.ok){ pw.value = pw2.value = ''; setTimeout(()=> r.session ? closeAuth() : showTab('login'), 900); }
  });

  // 로그인한 회원이 바뀌면 화면 상태를 정리하고 이번 달 일기를 불러옴
  function setUser(u){
    const prev = user ? user.id : null;
    user = u || null;
    const name = userName();
    const nameEl = document.getElementById('authName');
    nameEl.hidden = !user; nameEl.textContent = user ? (name || user.email || '') + (name ? ' 님' : '') : '';
    document.getElementById('openLogin').hidden = document.getElementById('openSignup').hidden = !!user;
    document.getElementById('logoutBtn').hidden = !user;
    if((user ? user.id : null) === prev) return;     // 토큰 갱신 등 같은 회원이면 그대로
    chat = null; flow = null; diarySeq++;
    Object.keys(months).forEach(k => delete months[k]);
    if(!sketch.hidden) closeSketch();
    if(bookShown()) closeBook();
    markGrid(homeGrid); if(bigGrid.ym) markGrid(bigGrid);
    updateShelf();
    if(user){ loadMonth(today.y, today.m); if(!calpage.hidden) loadMonth(viewY, viewM); }
  }
  if(sb){
    // 콜백 안에서 다른 Supabase 호출을 기다리지 않도록 한 박자 뒤에 처리
    sb.auth.onAuthStateChange((event, session)=>{ setTimeout(()=> setUser(session ? session.user : null), 0); });
  }

  // ---- 벽시계: 실제 시간처럼 초침이 움직임 ----
  const hourHand = document.getElementById('hourHand'), minHand = document.getElementById('minHand'), secHand = document.getElementById('secHand');
  const clockEl = document.getElementById('clock');
  function tick(){
    const t = new Date(), sec = t.getSeconds(), m = t.getMinutes() + sec / 60, h = t.getHours() % 12 + m / 60;
    hourHand.setAttribute('transform', `rotate(${h*30} 12 12)`);
    minHand.setAttribute('transform', `rotate(${m*6} 12 12)`);
    secHand.setAttribute('transform', `rotate(${sec*6} 12 12)`);
    clockEl.setAttribute('aria-label', `벽시계 ${t.getHours()}시 ${t.getMinutes()}분`);
    setTimeout(tick, 1000 - new Date().getMilliseconds());   // 매 초 정각에 맞춰 째깍
  }
  tick();

  // ---- 알림 ----
  const toastEl = document.getElementById('toast'); let tt;
  function toast(msg, ms = 2200){
    toastEl.textContent = msg; toastEl.classList.remove('hide');
    clearTimeout(tt); tt = setTimeout(()=>toastEl.classList.add('hide'), ms);
  }

  // ---- 화면 크기에 맞추기 (스크롤 없음) ----
  const vp = document.getElementById('viewport'), stage = document.getElementById('stage'), stageTop = document.getElementById('stageTop');
  function fit(){
    const w = vp.clientWidth, h = vp.clientHeight;
    const portrait = w / h < 1.05;
    const sw = portrait ? 600 : 1440, sh = portrait ? 1000 : 900;
    const s = Math.min(w / sw, h / sh);
    [stage, stageTop].forEach(el =>{ el.classList.toggle('portrait', portrait); el.style.transform = `scale(${s}) translate(-50%,-50%)`; });
  }
  window.addEventListener('resize', fit);
  const unscroll = el => el.addEventListener('scroll', ()=>{ if(el.scrollTop || el.scrollLeft){ el.scrollTop = 0; el.scrollLeft = 0; } });
  [document.body, document.getElementById('viewport')].forEach(unscroll);
  window.addEventListener('scroll', ()=>{ if(scrollX || scrollY) scrollTo(0, 0); });
  fit();
  renderHome();
  updateShelf();
  wakeServer();   // 잠든 서버를 미리 깨움 (공개 /health, 인증 없음)
  if(!sb) console.warn('Supabase 설정이 없어 로그인할 수 없습니다. config.js를 확인하세요.');
})();
</script>
</body>
</html>
