<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘, 그리고</title>
<!--
  일러스트 출처 (모두 디자인 시스템 색으로 변경)
  - 창문, 소파(Couch and Lamp, 조명 제외), 액자(Framed Picture), 달력의 책 아이콘(Closed Book), 표지 크레용(Crayon): OpenMoji (https://openmoji.org) — CC BY-SA 4.0
  - 화분(Potted Plant): Fluent Emoji (https://github.com/microsoft/fluentui-emoji) — MIT
  - 책장(Shelf Books 1), 달력(Calendar Date), 벽시계(Time Clock Circle):
    Streamline Ultimate Color (https://streamlinehq.com) — CC BY 4.0
-->
<style>
/* Layout: room wall on a fixed stage that scales to fit the screen, so the page never scrolls.
   Landscape stage 1440×900, portrait stage 600×1000. Colors from the Awwwards design system. */
/* 윤초록우산어린이 만세 (눈누, 웹 임베딩 허용): 굵기 하나뿐 */
@font-face{font-family:'YoonChoWooSan';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408@1.0/YoonChildfundkoreaManSeh.woff2') format('woff2');font-weight:normal;font-display:swap}
:root{
  --bg-primary:#f8f8f8; --ink:#222222; --white:#ffffff;
  --color-learn:#fff083; --color-learn-3:#fffbe2;
  --color-jobs-3:#b4d7f8; --color-read:#c0ab3c; --color-read-3:#dbd6c0;
  --color-inspire-3:#e2f4e9; --color-connect:#ff602c;
  --border-gray:#ededed; --neutral:#a7a7a7; --error:#c2410c; /* color-connect darkened for small text */
  --sans:'YoonChoWooSan', system-ui, sans-serif;
  --radius-sm:8px; --radius-pill:72px;
  --ease:.3s ease;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overflow:clip}
/* no drag-selecting text or dragging pictures anywhere (e.g. while drawing or flipping pages); typing fields stay selectable */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img,svg,canvas{-webkit-user-drag:none;user-drag:none}
body{
  background:var(--bg-primary); color:var(--ink); font-family:var(--sans);
  font-synthesis:none;   /* 굵기 하나뿐인 글꼴: 가짜 굵게 없이 같은 굵기로, 강조는 크기·색으로 */
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0; overscroll-behavior:none; word-break:keep-all;
}
.viewport{position:relative;width:100%;height:100%}
.stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:0 0}
.stage.portrait{width:600px;height:1000px}
.asset{position:absolute;display:block}
.asset svg{display:block;width:100%;height:100%;overflow:visible}
.asset [stroke]:not([stroke="none"]){vector-effect:non-scaling-stroke;stroke-width:3px}
.asset [stroke]:not([stroke="none"]) *{vector-effect:non-scaling-stroke}

/* light + shadow tokens (derived from ink and color-learn) */
:root{ --shadow:rgba(34,34,34,.18); --shadow-strong:rgba(34,34,34,.32); --sun:rgba(255,240,131,.55); --sun-soft:rgba(255,251,226,.75); --screen:rgba(180,215,248,.55) }

/* wall shading: brightest around the window, darker toward the corners */
.wall{position:absolute;left:-2000px;top:-2000px;width:5440px;height:2780px;
  background:radial-gradient(ellipse 1500px 1100px at 3190px 2270px, var(--sun-soft) 0%, rgba(255,251,226,.35) 30%, rgba(248,248,248,0) 60%, rgba(34,34,34,.07) 100%), var(--bg-primary)}
.portrait .wall{width:4600px;height:2905px;background:radial-gradient(ellipse 800px 900px at 2525px 2230px, var(--sun-soft) 0%, rgba(248,248,248,0) 42%, rgba(34,34,34,.09) 100%), var(--bg-primary)}

/* floor */
.floor{position:absolute;left:-2000px;right:-2000px;top:780px;height:2000px;border-top:3px solid var(--ink);
  background:linear-gradient(to bottom, rgba(34,34,34,.10) 0, rgba(34,34,34,0) 14px, rgba(34,34,34,.03) 40px, rgba(34,34,34,.16) 220px), var(--color-read-3)}
.portrait .floor{top:905px}

/* sunlight from the window: soft, diffused, spreading across the room */
.light{position:absolute;inset:0;pointer-events:none;filter:blur(36px);animation:breathe 8s ease-in-out infinite alternate}
.beam{position:absolute;inset:0;mix-blend-mode:multiply;
  clip-path:polygon(1040px 130px, 1340px 130px, 1480px 800px, 360px 800px);
  background:linear-gradient(200deg, rgba(255,240,131,.55) 0%, rgba(255,240,131,.25) 45%, rgba(255,240,131,.08) 100%)}
.floor-light{position:absolute;left:300px;top:770px;width:1240px;height:200px;
  background:radial-gradient(ellipse 50% 60% at 65% 20%, rgba(255,251,226,.95), rgba(255,251,226,.4) 55%, rgba(255,251,226,0) 100%)}
.glow{position:absolute;left:880px;top:-120px;width:620px;height:660px;pointer-events:none;
  background:radial-gradient(closest-side, var(--sun) 0%, rgba(255,240,131,.25) 55%, rgba(255,240,131,0) 100%)}
.portrait .light{display:none}
.portrait .glow{left:360px;top:30px;width:330px;height:400px}
@keyframes breathe{from{opacity:.75}to{opacity:1}}

/* contact shadows on the floor */
.cshadow{position:absolute;pointer-events:none;background:radial-gradient(closest-side, var(--shadow-strong), rgba(34,34,34,0))}
.cs-sofa{left:40px;top:764px;width:420px;height:32px}
.cs-shelf{left:485px;top:764px;width:480px;height:32px}
.cs-plant{left:1170px;top:768px;width:140px;height:22px}
.portrait .cs-sofa,.portrait .cs-plant{display:none}
.portrait .cs-shelf{left:30px;top:889px;width:540px;height:32px}

/* logo */
.logo{position:absolute;left:48px;top:40px;margin:0;font-size:46px;line-height:1.1;font-weight:600;letter-spacing:-.02em;color:var(--ink);z-index:3}
.logo span{font-weight:300;opacity:.6}
.portrait .logo{left:24px;top:28px;font-size:40px}
.stage-top{z-index:39;pointer-events:none}   /* 오버레이(최대 38) 위, 토스트(40) 아래 */
body:has(.reader:not([hidden])) .stage-top{z-index:34}   /* 책이 열려 있으면 책(35)을 가리지 않게 책 아래로 (달력 30 위) */
.logo button{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;pointer-events:auto;border-radius:var(--radius-sm)}
.logo button:focus-visible{outline:3px solid var(--color-connect);outline-offset:4px}

/* cast shadows: the window is on the right, so shadows fall to the left */
.window svg{filter:drop-shadow(-6px 14px 14px var(--shadow))}
.calendar svg{filter:drop-shadow(-14px 12px 14px var(--shadow))}
.clock svg{filter:drop-shadow(-12px 12px 12px var(--shadow))}
.shelf svg{filter:drop-shadow(-16px 10px 14px var(--shadow))}
.sofa svg{filter:drop-shadow(-12px 8px 14px var(--shadow))}
.picture svg{filter:drop-shadow(-12px 12px 12px var(--shadow))}
.plant svg{filter:drop-shadow(-8px 6px 10px var(--shadow))}
.portrait .calendar svg{filter:drop-shadow(-12px 12px 12px var(--shadow))}
.portrait .clock svg{filter:drop-shadow(-10px 10px 10px var(--shadow))}

/* wall items (1m ≈ 325px: floor-to-ceiling ≈ 2.4m) */
.window{left:1010px;top:80px;width:360px;height:360px}
.portrait .window{left:445px;top:150px;width:160px;height:160px}
.clock{left:60px;top:175px;width:110px;height:110px}
.picture{left:190px;top:120px;width:230px;height:230px}
.portrait .clock{left:30px;top:170px;width:96px;height:96px}

/* calendar */
.calendar{left:550px;top:30px;width:340px;height:340px}
.portrait .calendar{left:140px;top:95px;width:320px;height:320px}
.cal-head{position:absolute;left:27%;width:46%;top:13.7%;height:19%;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink)}
.cal-head b{font-size:36px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cal-head small{font-size:11px;line-height:1.3;font-weight:500;letter-spacing:.12em}
.portrait .cal-head b{font-size:30px}
.portrait .cal-head small{font-size:8px}
.cal-grid{position:absolute;left:8%;width:84%;top:35%;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:11px;font-weight:500;text-align:center;padding:0 0 4px}
.cal-dow.sun{color:var(--color-connect)}
.day{display:grid;place-items:center;font-size:14px;font-weight:500;color:var(--ink);
  height:30px;border-radius:var(--radius-sm);font-variant-numeric:tabular-nums}
.portrait .day{font-size:13px;height:29px}
.portrait .cal-dow{font-size:9px;padding-bottom:2px}
.day.sun{font-weight:600;color:var(--error)}
.day.today{background:var(--color-learn);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--ink)}
.day.empty{visibility:hidden}
.calendar{cursor:pointer;outline:none;transition:transform var(--ease)}
.calendar:hover{transform:translateY(-6px)}
.calendar:active{transform:translateY(-2px)}
.calendar:focus-visible svg{outline:3px solid var(--color-connect);outline-offset:-20px;border-radius:var(--radius-sm)}

/* floor furniture: sofa ≈ 1.15m wide, shelf ≈ 1.2m tall */
.sofa{left:20px;top:329px;width:520px;height:520px}
.plant{left:1110px;top:537px;width:260px;height:260px}
.portrait .sofa,.portrait .plant,.portrait .picture{display:none}

/* bookshelf (one button) */
.shelf{left:480px;top:339px;width:480px;height:480px;cursor:pointer;outline:none;transition:transform var(--ease)}
.shelf:hover{transform:translateY(-6px)}
.shelf:active{transform:translateY(-2px)}
.shelf:focus-visible svg{outline:3px solid var(--color-connect);outline-offset:4px;border-radius:var(--radius-sm)}
.portrait .shelf{left:20px;top:391px;width:560px;height:560px}

/* action hints beside the interactive objects (Awwwards: color-learn pill, ink text and border, link-sm 14px/500, radius-pill).
   They sit inside the object's button, so they lift on hover and open it on click. */
.hint{position:absolute;display:block;white-space:nowrap;padding:8px 20px;border:2px solid var(--ink);border-radius:var(--radius-pill);
  background:var(--color-learn);color:var(--ink);font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-.01em;   /* larger than link-sm for readability */
  box-shadow:-6px 6px 12px var(--shadow)}
.hint::before{content:"";position:absolute;border:7px solid transparent;right:100%;top:50%;margin-top:-7px;border-right-color:var(--ink)}  /* arrow points left, at the object */
.calendar .hint{left:332px;top:150px}
.shelf .hint{left:470px;top:80px}
.portrait .calendar .hint{left:auto;right:calc(100% - 4px);top:210px}   /* portrait: left of the calendar, arrow points right */
.portrait .calendar .hint::before{right:auto;left:100%;border-right-color:transparent;border-left-color:var(--ink)}
.portrait .shelf .hint{left:50%;top:530px;transform:translateX(-50%)}   /* portrait: on the floor below the shelf, arrow points up */
.portrait .shelf .hint::before{right:auto;left:50%;top:auto;bottom:100%;margin:0 0 0 -7px;border-right-color:transparent;border-bottom-color:var(--ink)}

/* credit + toast */
.credit{position:absolute;right:24px;bottom:16px;margin:0;font-size:10px;font-weight:500;line-height:1.3;color:var(--ink);opacity:.6}
.portrait .credit{right:12px;font-size:9px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,0);
  background:var(--ink);color:var(--white);font-size:15px;font-weight:500;line-height:1.4;padding:10px 20px;border-radius:var(--radius-pill);
  white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity var(--ease),transform var(--ease);z-index:40}
.toast.hide{opacity:0;transform:translate(-50%,10px);pointer-events:none}
body:has(.page-nav.show) .toast{bottom:calc(76px + env(safe-area-inset-bottom, 0px))}   /* keep clear of the diary page nav */

/* ===== reader: the book opens and the chat lives on its right-hand page ===== */
:root{ --paper:#fffdf6; --rule:rgba(180,215,248,.45); --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .4  0 0 0 .09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); --line:34px }
.reader{position:fixed;inset:0;z-index:35;overflow:hidden;
  background:rgba(34,34,34,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity var(--ease)}
.reader.show{opacity:1}
.reader.closing,.calpage.closing{pointer-events:none}   /* closing animation plays on, but taps reach whatever is underneath */

/* the book: closed size, then the cover swings left and the spread fills most of the screen */
.book{--bh:min(86vh, 62vw);--bw:calc(var(--bh) * .72);
  position:absolute;left:50%;top:50%;width:var(--bw);height:var(--bh);margin:calc(var(--bh) / -2) 0 0 calc(var(--bw) / -2);
  perspective:2600px;transition:transform .8s ease}
.book.open{transform:translateX(calc(var(--bw) / 2))}
.book{--cover:var(--color-jobs-3);--cover-ink:var(--ink)}
.book .back-cover{position:absolute;inset:-10px -10px -10px 0;background:var(--cover);border:3px solid var(--ink);border-radius:3px 14px 14px 3px;box-shadow:0 30px 50px rgba(0,0,0,.28)}
/* right-hand page = chat */
.book .page{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:2px 8px 8px 2px;overflow:hidden;
  background:var(--noise), repeating-linear-gradient(to bottom, transparent 0 calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px) var(--line)), var(--paper);
  box-shadow:3px 0 0 #f1ede0, 6px 0 0 #e9e4d4}
.book .cover{position:absolute;inset:0;z-index:3;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,0,.2,1), opacity .3s ease, z-index 0s 0s}
.book.open .cover{z-index:1;transition:transform .9s cubic-bezier(.4,0,.2,1), opacity .3s ease, z-index 0s .9s}
.book.open .cover{transform:rotateY(-180deg)}   /* lies fully flat: at -178deg perspective made the left page taller at its outer edge than the right page */
.book .face,.book .inside{position:absolute;inset:-10px -10px -10px 0;border:3px solid var(--ink);border-radius:3px 14px 14px 3px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.book .face{background:var(--cover);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;color:var(--ink);
  box-shadow:inset 22px 0 0 rgba(34,34,34,.08)}
.book .face{gap:calc(var(--bw) * .045)}
.book .face::after{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;
  background:linear-gradient(to bottom, transparent 9%, rgba(34,34,34,.22) 9% 11%, transparent 11% 89%, rgba(34,34,34,.22) 89% 91%, transparent 91%)}
.book .cover-frame{position:absolute;top:calc(var(--bw) * .07);bottom:calc(var(--bw) * .07);left:calc(var(--bw) * .11);right:calc(var(--bw) * .07);
  border:2px solid var(--cover-ink);border-radius:8px;opacity:.28}
.book .cover-frame::before{content:"";position:absolute;inset:6px;border:1px solid var(--cover-ink);border-radius:5px}
.book .cover-eyebrow{position:relative;font-size:calc(var(--bw) * .036);font-weight:600;letter-spacing:.42em;padding-left:.42em;color:var(--cover-ink)}
.book .cover-plate{position:relative;padding:calc(var(--bw) * .05) calc(var(--bw) * .075);border:3px solid var(--ink);border-radius:8px;
  background:var(--noise), var(--paper);box-shadow:6px 7px 0 rgba(34,34,34,.2)}
.book .cover-date{position:relative;font-size:calc(var(--bw) * .03);font-weight:500;letter-spacing:.12em;color:var(--cover-ink);font-variant-numeric:tabular-nums;opacity:.85}
.book .cover-icon{position:absolute;right:calc(var(--bw) * .12);bottom:calc(var(--bw) * .11);width:calc(var(--bw) * .16);height:calc(var(--bw) * .16);transform:rotate(-6deg)}
.book .cover-icon svg{width:100%;height:100%;display:block;overflow:visible}
.book .cover-icon [stroke]:not([stroke="none"]),.book .cover-icon [stroke]:not([stroke="none"]) *{vector-effect:non-scaling-stroke;stroke-width:2.5px}
.book .cover-logo{font-size:calc(var(--bw) * .108);line-height:1.1;font-weight:600;letter-spacing:-.02em;white-space:nowrap;color:var(--ink)}
.book .cover-logo span{font-weight:300;opacity:.6}
/* left-hand page (inside of the cover): plain paper */
.book .inside{background:var(--cover);transform:rotateY(180deg);padding:10px 0 10px 10px}
/* insets measured from inside the cover's 3px border, so the left page is exactly as tall as the right page (0 … book height) */
.book .inside::before{content:"";position:absolute;inset:7px 0 7px 7px;border-radius:8px 2px 2px 8px;
  background:var(--noise), var(--paper);box-shadow:-3px 0 0 #f1ede0, -6px 0 0 #e9e4d4}

/* chat contents fade in once the book is open */
.chat{display:flex;flex-direction:column;flex:1;min-height:0;opacity:0;transform:translateY(8px);transition:opacity .35s ease, transform .35s ease}
.book.ready .chat{opacity:1;transform:none}
.chat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:clamp(18px, 3.5vh, 32px) clamp(18px, 2.4vw, 32px) 12px clamp(26px, 3vw, 40px);border-bottom:2px solid rgba(34,34,34,.12)}
.chat-head .title{display:flex;flex-direction:column;gap:4px;min-width:0}
.chat-head .date{font-size:12px;font-weight:500;letter-spacing:.06em;opacity:.6}
.chat-head h2{margin:0;font-size:clamp(20px, 2.8vh, 28px);line-height:1.2;font-weight:600;letter-spacing:-.02em}
.close{appearance:none;border:2px solid var(--ink);background:transparent;color:var(--ink);width:38px;height:38px;border-radius:50%;flex:none;
  font:inherit;font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background var(--ease)}
.close:hover{background:var(--color-learn)}
.messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px clamp(18px, 2.4vw, 32px) 20px clamp(26px, 3vw, 40px);display:flex;flex-direction:column;gap:12px}
.empty-state{margin:auto;text-align:center;font-size:15px;line-height:1.6;opacity:.5}
.msg{flex:none;max-width:78%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--white);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--white);border:2px solid var(--ink);border-bottom-left-radius:4px;min-width:72px;min-height:46px;box-shadow:3px 3px 0 rgba(34,34,34,.12)}
.msg.typing{display:flex;gap:4px;align-items:center}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.3;animation:dot 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.15s}.msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:1}}
.composer{display:flex;gap:10px;align-items:flex-end;padding:12px clamp(18px, 2.4vw, 32px) clamp(16px, 3vh, 28px) clamp(26px, 3vw, 40px);border-top:2px solid rgba(34,34,34,.12)}
.composer textarea{flex:1;min-width:0;resize:none;border:2px solid var(--ink);border-radius:var(--radius-sm);padding:10px 12px;
  font:inherit;font-size:15px;line-height:1.4;color:var(--ink);background:rgba(255,255,255,.7);max-height:120px;outline:none}
.composer textarea::placeholder{color:var(--ink);opacity:.45}
.composer textarea:focus{box-shadow:0 0 0 3px var(--color-learn)}
.send{appearance:none;border:0;background:var(--ink);color:var(--white);font:inherit;font-size:15px;font-weight:500;padding:12px 20px;border-radius:var(--radius-pill);cursor:pointer;transition:opacity var(--ease)}
.send:disabled{opacity:.3;cursor:default}
.close:focus-visible,.send:focus-visible{outline:3px solid var(--color-connect);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* narrow screens: no room for a two-page spread, so the cover swings away and the right page fills the screen */
@media (max-width:700px), (max-aspect-ratio:1/1){
  .book{--bw:min(calc(100vw - 40px), 560px);--bh:min(86vh, calc(var(--bw) * 1.7))}
  .book.open{transform:none}
  .book.open .cover{opacity:0}
}

/* ===== left page (inside of the cover) ===== */
.inside{display:flex;align-items:center;justify-content:center}

/* ===== calendar page: the home calendar itself zooms up (same asset, same layout, scaled) ===== */
.calpage{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
/* only the dimmed backdrop fades; the calendar itself stays fully visible while it shrinks back onto the wall */
.calpage::before{content:"";position:absolute;inset:0;background:rgba(34,34,34,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .35s ease}
.calpage.show::before{opacity:1}
.calendar.at-rest{transform:none!important;transition:none!important}
/* every size is the home calendar's px value ÷ its width (340px) in cqw, so the big calendar is the same picture, only larger */
.bigcal{position:relative;width:min(96vh, 100%);aspect-ratio:1;container-type:size;transform-origin:0 0}
.bigcal.anim{transition:transform .7s cubic-bezier(.4,0,.2,1)}
.bigcal > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(-4.12cqw 3.53cqw 4.12cqw var(--shadow))}
.bigcal > svg [stroke]:not([stroke="none"]){vector-effect:non-scaling-stroke;stroke-width:.88cqw}
.bigcal .cal-head{gap:2.94cqw}
.bigcal .cal-head b{font-size:10.59cqw}
.bigcal .cal-head small{font-size:3.24cqw}
.bigcal .cal-grid{gap:.59cqw}
.bigcal .cal-dow{font-size:3.24cqw;padding-bottom:1.18cqw}
.cell{position:relative;appearance:none;border:0;background:transparent;font:inherit;color:var(--ink);cursor:pointer;padding:0;min-width:0;
  height:8.82cqw;border-radius:2.35cqw;display:grid;place-items:center;
  font-size:4.12cqw;font-weight:500;font-variant-numeric:tabular-nums;transition:background var(--ease)}
.cell:hover{background:var(--border-gray)}
.cell .num{line-height:1}
.cell.sun{font-weight:600;color:var(--error)}
.cell.today,.cell.today:hover{background:var(--color-learn);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 .44cqw var(--ink)}
.cell.empty{visibility:hidden}
/* phone: the home calendar is 320px with its own sizes, so scale those instead */
.calpage.pcal .bigcal > svg{filter:drop-shadow(-3.75cqw 3.75cqw 3.75cqw var(--shadow))}
.calpage.pcal .bigcal > svg [stroke]:not([stroke="none"]){stroke-width:.94cqw}
.calpage.pcal .bigcal .cal-head{gap:3.13cqw}
.calpage.pcal .bigcal .cal-head b{font-size:9.38cqw}
.calpage.pcal .bigcal .cal-head small{font-size:2.5cqw}
.calpage.pcal .bigcal .cal-grid{gap:.63cqw}
.calpage.pcal .bigcal .cal-dow{font-size:2.81cqw;padding-bottom:.63cqw}
.calpage.pcal .cell{height:9.06cqw;font-size:4.06cqw;border-radius:2.5cqw}
/* picture-diary mark: a small book at the top-right of the date (same on the wall and when enlarged) */
.day{position:relative}
.bookmark{position:absolute;pointer-events:none;top:3px;right:5px;width:10px;height:10px}
.bookmark svg{width:100%;height:100%;display:block;overflow:visible}
.bookmark [stroke]:not([stroke="none"]),.bookmark [stroke]:not([stroke="none"]) *{vector-effect:non-scaling-stroke;stroke-width:1px}
.cell .bookmark{top:.88cqw;right:1.47cqw;width:2.94cqw;height:2.94cqw}
.cell .bookmark [stroke]:not([stroke="none"]),.cell .bookmark [stroke]:not([stroke="none"]) *{stroke-width:.29cqw}
.portrait .day .bookmark{right:4px}
.cell:focus-visible{outline:3px solid var(--color-connect);outline-offset:1px}
/* diary mode: the same book, read-only */
/* left page uses the same lined paper as the right page */
.book.readonly .inside::before{background:var(--noise), repeating-linear-gradient(to bottom, transparent 0 calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px) var(--line)), var(--paper)}
.book.readonly .composer{display:none}
/* clock second hand */
#secHand{stroke:var(--color-connect)}
.asset #secHand{stroke-width:1.5px}

/* diary: a blank 4-page book you can page through */
.book.readonly .chat{display:none}
.book .pno{position:absolute;bottom:18px;font-size:12px;font-weight:500;opacity:.45;font-variant-numeric:tabular-nums;z-index:1}
.book .page .pno{right:28px}
.book .inside .pno{left:28px;bottom:25px}   /* the cover box reaches 7px past the page, so lift the number to line up with the right page's */
.leaf{position:absolute;inset:0;z-index:2;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1), opacity .8s ease;cursor:pointer}
.leaf.turned{transform:rotateY(-180deg)}   /* lands flat, exactly on the left page */
.leaf .lf,.leaf .lb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 8px 8px 2px;
  background:var(--noise), repeating-linear-gradient(to bottom, transparent 0 calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px) var(--line)), var(--paper)}
/* the turning sheet carries the same stacked page edges (3px / 6px) as the page it lifts from and the page it lands on,
   so it looks identical at the start, keeps that spacing all the way over, and lands without a jump */
.leaf .lf{box-shadow:3px 0 0 #f1ede0, 6px 0 0 #e9e4d4}
.leaf .lb{left:3px;transform:rotateY(180deg);border-radius:8px 2px 2px 8px;   /* stops 3px short of the spine, like the left page it lands on */box-shadow:-3px 0 0 #f1ede0, -6px 0 0 #e9e4d4}
.leaf .lf .pno{right:28px}.leaf .lb .pno{left:28px}
/* page 1 is the picture page: no ruled lines, just the picture (or the dashed spot where it goes) */
.book.readonly.plain-left .inside::before,.book.readonly.plain-right .page,.leaf .plain{background:var(--noise), var(--paper)}
.leaf .plain{display:flex;align-items:center;justify-content:center}
/* diary page 1 (picture-diary form) and page 2 (4-cut comic) fill the page with the same margins
   on the right page, on the cover's inside page (whose paper starts 7px into its box) and on a turning sheet */
.dp1,.comic{position:absolute;top:30px;right:28px;bottom:50px;left:28px}
.book .inside > .dp1,.book .inside > .comic{top:37px;left:35px;bottom:57px}
/* page 1 follows a Korean picture-diary sheet: date line, weather + name line, picture box, then a writing grid (wongoji) */
.dp1{display:flex;flex-direction:column;gap:10px;color:var(--ink);container-type:size}
.dp1-date{display:flex;align-items:baseline;justify-content:space-between;padding:0 4% 8px;border-bottom:2px solid var(--ink);
  font-size:16px;line-height:1.3;font-weight:500;white-space:nowrap}
.dp1-date b{display:inline-block;min-width:1.6em;margin-right:4px;text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.dp1-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:600;white-space:nowrap}
.dp1-weather{display:flex;align-items:center;gap:6px}
.dp1-weather .lbl{margin-right:6px}
.wx{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%}
.wx svg{width:24px;height:24px;display:block;overflow:visible}
.wx.on{box-shadow:0 0 0 2.5px var(--color-connect)}   /* the chosen weather is circled, as a child would circle it */
.dp1-name{display:flex;align-items:baseline;gap:6px}
.dp1-name b{min-width:80px;padding:0 4px 2px;border-bottom:1.5px solid var(--ink);font-weight:500}
/* picture box has the sketchbook canvas's 3:2 ratio, so the drawing shows whole, never cropped.
   It takes the height left after the date/weather lines (~100px) and the 10:6 writing grid (60% of the width) */
.dp1-pic{position:relative;flex:none;align-self:center;aspect-ratio:3 / 2;width:min(100%, max(150px, calc((100cqh - 60cqw - 100px) * 1.5)));
  display:grid;place-items:center;overflow:hidden;background:var(--white);border:2px solid var(--ink);border-radius:10px}
.dp1-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.dp1-pic.blank{background:transparent}
.dp1-pic.blank::after{content:"그린 그림이 없어요";font-size:13px;font-weight:500;opacity:.5}
/* writing lines: six underlined lines (each 10cqw of the page width, so the box keeps the 10:6 height the picture box is sized against);
   longer text continues on lined-only pages (.dpn, built by paginate()) */
.dp1-grid{flex:none;height:60cqw;overflow:hidden;padding:0 6px;
  font-size:4.4cqw;line-height:10cqw;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere;
  background:repeating-linear-gradient(to bottom, transparent 0 calc(10cqw - 1.5px), rgba(34,34,34,.6) calc(10cqw - 1.5px) 10cqw) local}
.comic .panel.blank::after{content:"그림이 들어갈 자리";font-size:13px;font-weight:500;opacity:.5}
.comic{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));grid-template-rows:repeat(2, minmax(0,1fr));gap:14px}
.comic .panel{position:relative;display:grid;place-items:center;overflow:hidden;background:var(--white);border:3px solid var(--ink);border-radius:4px;box-shadow:4px 5px 0 rgba(34,34,34,.12)}
.comic .panel img{width:100%;height:100%;object-fit:cover;display:block}
.comic .panel.blank{background:transparent;border:2px dashed rgba(34,34,34,.35);box-shadow:none}
.comic .panel b{position:absolute;left:8px;top:6px;font-size:12px;font-weight:600;opacity:.55}
/* end-chat button in the chat header (Awwwards solid button: ink fill, white label, pill) */
.end-chat{appearance:none;border:0;flex:none;background:var(--ink);color:var(--white);font:inherit;font-size:14px;font-weight:500;
  padding:9px 16px;border-radius:var(--radius-pill);cursor:pointer;transition:opacity var(--ease)}
.end-chat:hover{opacity:.85}
.end-chat.armed{background:var(--color-connect);color:var(--ink)}   /* first press: asks for a second press (ink on orange: 6.9:1) */
.end-chat:focus-visible{outline:3px solid var(--color-connect);outline-offset:2px}
.page-nav{position:fixed;left:50%;bottom:max(14px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:36;display:flex;align-items:center;gap:12px;
  padding:6px 8px;border-radius:var(--radius-pill);background:var(--white);border:2px solid var(--ink);opacity:0;transition:opacity .3s ease}
.page-nav.show{opacity:1}
.page-nav button{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;width:34px;height:34px;border-radius:50%;cursor:pointer}
.page-nav button:hover:not(:disabled){background:var(--color-learn)}
.page-nav button:disabled{opacity:.25;cursor:default}
.page-nav button:focus-visible{outline:3px solid var(--color-connect);outline-offset:1px}
.page-nav span{font-size:13px;font-weight:500;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:700px), (max-aspect-ratio:1/1){
  .leaf.turned{opacity:0}
}

/* review the AI draft before saving: redraw / save buttons in the page nav */
.page-nav .act{width:auto;border-radius:var(--radius-pill);padding:0 14px;font-size:13px;font-weight:500;white-space:nowrap}
.page-nav .act.solid{background:var(--ink);color:var(--white)}
.page-nav .act.solid:hover:not(:disabled){background:var(--ink);opacity:.85}
.page-nav .act[hidden],.page-nav .log-btn[hidden]{display:none}
@media (max-width:420px){ .page-nav{gap:4px} .page-nav .act,.page-nav .log-btn{padding:0 10px} }
.dp1-grid.muted{opacity:.55}
/* 줄 수 재기용 보이지 않는 글 칸 (1쪽 글 칸과 같은 너비·글꼴) */
.dp-measure{visibility:hidden;pointer-events:none}
.dp-measure .dp1-grid{height:auto}

/* chat: message being sent, failed message (retry with the same request id), notes */
.msg.user.sending{opacity:.6}
.msg.user.failed{background:var(--white);color:var(--ink);border:2px dashed var(--color-connect)}
.msg-fail,.chat-note{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:500}
.msg-fail{align-self:flex-end}
.chat-note{align-self:center;justify-content:center;text-align:center}
.msg-fail button,.chat-note button{appearance:none;border:2px solid var(--ink);background:var(--white);color:var(--ink);font:inherit;font-size:13px;font-weight:500;
  padding:4px 12px;border-radius:var(--radius-pill);cursor:pointer}
.msg-fail button:hover,.chat-note button:hover{background:var(--color-learn)}
.msg-fail button:focus-visible,.chat-note button:focus-visible{outline:3px solid var(--color-connect);outline-offset:2px}
.end-chat:disabled,.send:disabled{cursor:default}

/* calendar: month navigation and loading */
.cal-nav{position:absolute;top:19%;z-index:1;width:8.5cqw;height:8.5cqw;padding:0;display:grid;place-items:center;appearance:none;
  border:.6cqw solid var(--ink);border-radius:50%;background:var(--white);color:var(--ink);font:inherit;font-size:5cqw;line-height:1;cursor:pointer}
.cal-nav.prev{left:14%}
.cal-nav.next{right:14%}
.cal-nav:hover{background:var(--color-learn)}
.cal-nav:focus-visible{outline:3px solid var(--color-connect);outline-offset:2px}
.bigcal.loading .cal-grid{opacity:.55}
.cell.loading{opacity:.5}

/* empty AI reply (no AI connected yet): shown as a muted note instead of an empty bubble */
.msg.ai.pending{opacity:.55;font-size:14px}

/* ===== sketchbook: after the chat ends, draw today's picture ===== */
.sketch{position:fixed;inset:0;z-index:37;display:grid;place-items:center;overflow:auto;padding:28px 16px 16px;
  background:rgba(34,34,34,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .3s ease}
.sketch.show{opacity:1}
/* kraft-board cover with a spiral binding across the top, white drawing sheet inside */
.sketchbook{position:relative;width:min(880px, 100%);padding:26px 16px 16px;border:3px solid var(--ink);border-radius:14px;
  background:var(--color-read);box-shadow:0 30px 60px rgba(0,0,0,.3);transform:translateY(14px);transition:transform .3s ease}
.sketch.show .sketchbook{transform:none}
/* twin-wire spiral binding: each 28px step is a hole punched near the top of the sheet with a pair of metal wire loops
   coming out of it, arching over the top edge of the board and disappearing behind it (ink outline, neutral metal, white glint).
   Coordinates: the board's top edge sits at y=13 and the sheet starts at y=42 inside the 56px-tall strip */
.sketchbook .rings{position:absolute;left:30px;right:30px;top:-16px;height:56px;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='56' viewBox='0 0 28 56'><ellipse cx='12.5' cy='48.5' rx='6' ry='3.2' fill='%23222222'/><g fill='none' stroke-linecap='round'><path d='M9.5 48 C6.5 34 5.5 10 10.5 4 C13.5 0 16.5 4 16.5 11' stroke='%23222222' stroke-width='4.2'/><path d='M9.5 48 C6.5 34 5.5 10 10.5 4 C13.5 0 16.5 4 16.5 11' stroke='%23a7a7a7' stroke-width='2.2'/><path d='M8.9 44 C6.3 32 5.4 12 9.8 5.2' stroke='%23ffffff' stroke-width='.8'/><path d='M14.5 48 C11.5 34 10.5 10 15.5 4 C18.5 0 21.5 4 21.5 11' stroke='%23222222' stroke-width='4.2'/><path d='M14.5 48 C11.5 34 10.5 10 15.5 4 C18.5 0 21.5 4 21.5 11' stroke='%23a7a7a7' stroke-width='2.2'/><path d='M13.9 44 C11.3 32 10.4 12 14.8 5.2' stroke='%23ffffff' stroke-width='.8'/></g></svg>") 0 0 / 28px 56px repeat-x}
.sheet{display:flex;flex-direction:column;gap:12px;padding:20px 22px 18px;border-radius:4px;background:var(--noise), var(--white);
  box-shadow:inset 0 2px 0 rgba(34,34,34,.08)}
.sk-head h2{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
.sk-head p{margin:4px 0 0;font-size:14px;line-height:1.5;opacity:.65}
/* the 3:2 sheet gets whatever height is left after the title, tools and weather rows (~430px), so the sketchbook never scrolls */
.sk-canvas{display:block;width:min(100%, max(240px, calc((100vh - 430px) * 1.5)));aspect-ratio:3 / 2;margin:0 auto;touch-action:none;cursor:crosshair;
  background:var(--white);border:2px solid var(--ink);border-radius:8px}
.sk-tools,.sk-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sk-tools{justify-content:space-between}
.sk-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sk-swatch{appearance:none;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--ink);cursor:pointer;background:var(--c)}
.sk-swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--white), 0 0 0 5.5px var(--ink)}
.sk-swatch{width:20px;height:20px;border-width:1.5px}
.sk-swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--white), 0 0 0 4px var(--ink)}
#skColors{display:flex;flex-wrap:wrap;gap:6px;max-width:410px}   /* 16 small swatches in one row (rainbow first, then everyday colours); wraps on phones */
/* brush picker: a button showing the current brush's stroke, opening a list of brushes with stroke previews (like Paint's brush menu) */
.sk-brush{position:relative}
.sk-brush-btn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px}
.sk-brush-btn canvas{width:60px;height:22px;display:block}
.sk-brush-menu{position:absolute;left:0;bottom:calc(100% + 8px);z-index:3;display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:6px;
  width:min(340px, 80vw);padding:10px;background:var(--white);border:2px solid var(--ink);border-radius:var(--radius-sm);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.sk-brush-item{appearance:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border:2px solid transparent;border-radius:var(--radius-sm);
  background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
.sk-brush-item canvas{width:120px;max-width:100%;height:36px;display:block}
.sk-brush-item:hover{background:var(--color-learn-3)}
.sk-brush-item[aria-checked="true"]{border-color:var(--ink);background:var(--color-learn-3)}
/* thickness: a draggable bar, with a dot showing the stroke at its real on-screen size */
.sk-thick{gap:10px;font-size:14px;font-weight:600}
.sk-thick input{width:150px;accent-color:var(--ink);cursor:pointer}
.sk-thick-dot{display:grid;place-items:center;width:40px;height:40px}
.sk-thick-dot i{display:block;border-radius:50%;background:var(--ink);max-width:40px;max-height:40px}
.sk-thick output{min-width:2ch;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;opacity:.7}
.sk-btn{appearance:none;font:inherit;font-size:14px;font-weight:500;color:var(--ink);padding:7px 14px;border:2px solid var(--ink);border-radius:var(--radius-pill);
  background:var(--white);cursor:pointer;transition:background var(--ease)}
.sk-btn:hover,.sk-btn[aria-pressed="true"]{background:var(--color-learn)}
.sk-meta{justify-content:space-between;padding-top:10px;border-top:2px solid rgba(34,34,34,.12);font-size:14px;font-weight:600}
.sk-weather{display:flex;align-items:center;gap:6px}
.sk-weather .wx{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;width:38px;height:38px}
.sk-weather .wx svg{width:26px;height:26px}
.sk-weather .wx[aria-checked="true"]{box-shadow:0 0 0 2.5px var(--color-connect)}
.sk-meta .sk-done{margin-left:auto}   /* the finish button shares the weather/name row instead of taking its own */
/* small phones: tighter frame, no subtitle, slimmer controls, so everything still fits on one screen */
@media (max-width:520px){
  .sketch{padding:22px 8px 8px}
  .sketchbook{padding:22px 8px 8px}
  .sheet{gap:8px;padding:12px 12px 12px}
  .sk-head h2{font-size:20px}
  .sk-head p{display:none}
  .sk-tools,.sk-meta{gap:8px}
  .sk-meta{padding-top:8px}
  .sk-thick input{width:100px}
  .sk-thick-dot{width:30px;height:30px}
  .sk-btn{padding:5px 11px;font-size:13px}
  .sk-weather .wx{width:32px;height:32px}
  .sk-done{padding:9px 16px;font-size:14px}
}
.sk-done{appearance:none;border:0;font:inherit;font-size:15px;font-weight:600;color:var(--white);background:var(--ink);padding:11px 22px;border-radius:var(--radius-pill);cursor:pointer}
.sk-done:hover{opacity:.88}
.sketch button:focus-visible{outline:3px solid var(--color-connect);outline-offset:2px}

/* ===== login / sign-up (UI only) ===== */
.auth-btns{position:absolute;right:48px;top:44px;z-index:3;display:flex;gap:10px}
.portrait .auth-btns{right:24px;top:34px}
.auth-btn{appearance:none;font:inherit;font-size:15px;font-weight:500;padding:10px 20px;border-radius:var(--radius-pill);cursor:pointer;
  border:2px solid var(--ink);background:var(--white);color:var(--ink);transition:background var(--ease), transform var(--ease)}
.auth-btn:hover{background:var(--color-learn-3);transform:translateY(-2px)}
.auth-btn.solid{background:var(--ink);color:var(--white)}
.auth-btn.solid:hover{background:var(--ink);opacity:.88}
.auth-btn:focus-visible{outline:3px solid var(--color-connect);outline-offset:2px}
.auth-btn[hidden],.auth-name[hidden]{display:none}
.auth-name{align-self:center;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600}
.portrait .auth-name{max-width:120px}
.auth{position:fixed;inset:0;z-index:38;display:grid;place-items:center;padding:16px;background:rgba(34,34,34,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .3s ease}
.auth.show{opacity:1}
.auth-card{width:min(420px, 100%);max-height:100%;overflow:auto;border-radius:6px;padding:10px 30px 28px;
  background:var(--noise), var(--paper);box-shadow:0 30px 60px rgba(0,0,0,.3);transform:translateY(12px);transition:transform .3s ease}
.auth.show .auth-card{transform:none}
/* chat log of a diary (opened from the diary book's page nav): same card as the login dialog */
.page-nav .log-btn{width:auto;border-radius:var(--radius-pill);padding:0 14px;font-size:13px;font-weight:500;margin-left:4px}
.page-nav .log-btn,.page-nav .del{white-space:nowrap}   /* keep each label on one line on narrow screens */
.log{position:fixed;inset:0;z-index:38;display:grid;place-items:center;padding:16px;background:rgba(34,34,34,.5);opacity:0;transition:opacity .3s ease}
.log.show{opacity:1}
.log-card{width:min(520px, 100%);max-height:min(80vh, 100%);display:flex;flex-direction:column;border-radius:6px;overflow:hidden;
  background:var(--noise), var(--paper);box-shadow:0 30px 60px rgba(0,0,0,.3);transform:translateY(12px);transition:transform .3s ease}
.log.show .log-card{transform:none}
.log-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:24px 24px 14px;border-bottom:2px solid rgba(34,34,34,.12)}
.log-head .date{display:block;font-size:12px;font-weight:500;letter-spacing:.06em;opacity:.6;margin-bottom:4px}
.log-head h2{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
.log-close{appearance:none;flex:none;border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:500;
  padding:7px 16px;border-radius:var(--radius-pill);cursor:pointer;transition:background var(--ease)}
.log-close:hover{background:var(--color-learn)}
.log-close:focus-visible{outline:3px solid var(--color-connect);outline-offset:2px}
.log-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px}
.auth-tabs{display:flex;gap:4px;border-bottom:2px solid rgba(34,34,34,.12);margin:0 -8px 20px}
.auth-tabs button{appearance:none;border:0;background:none;font:inherit;font-size:15px;font-weight:500;color:var(--ink);opacity:.5;padding:14px 12px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.auth-tabs button[aria-selected="true"]{opacity:1;font-weight:600;border-bottom-color:var(--ink)}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-title{margin:0 0 4px;font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:13px;font-weight:600}
.field input{border:2px solid var(--ink);border-radius:var(--radius-sm);padding:11px 12px;font:inherit;font-size:15px;color:var(--ink);background:rgba(255,255,255,.8);outline:none}
.field input:focus{box-shadow:0 0 0 3px var(--color-learn)}
.field input[aria-invalid="true"]{border-color:var(--color-connect)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ink)}
.auth-msg{margin:0;min-height:20px;font-size:13px;line-height:1.5;font-weight:500;color:var(--error)}
.auth-msg.ok{color:var(--ink)}
.auth-submit{appearance:none;border:0;background:var(--ink);color:var(--white);font:inherit;font-size:16px;font-weight:600;padding:14px;border-radius:var(--radius-pill);cursor:pointer}
.auth-submit:hover{opacity:.88}
.auth-switch{margin:0;text-align:center;font-size:13px;opacity:.8}
.link{appearance:none;border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;cursor:pointer}
.auth-tabs button:focus-visible,.auth-submit:focus-visible,.link:focus-visible{outline:3px solid var(--color-connect);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4/dist/umd/supabase.js"></script>
<!-- 환경별 설정 (config.example.js를 복사해 만듦, git 제외) -->
<script src="config.js"></script>
<script>
(function(){
  // ---- 설정: config.js(환경별, git 제외)에서 지정. 없으면 로컬 개발 기본값 ----
  // FE에는 Publishable key만 둡니다. Secret key·AI 공급자 키는 넣지 않습니다.
  const CFG = Object.assign({
    API_BASE: 'http://127.0.0.1:8000',
    SUPABASE_URL: 'https://nnbmxtiouvsuszretahg.supabase.co',
    SUPABASE_PUBLISHABLE_KEY: '',
  }, window.APP_CONFIG || {});
  const API_BASE = String(CFG.API_BASE || '').replace(/\/+$/, '');
  // 제한시간(ms): 인증 세션 조회·갱신 + 요청 + 응답 본문 읽기 전체. config.js의 TIMEOUT_MS로 덮어쓰기 가능
  const TMO = Object.assign({
    request: 60000,     // 일반 조회 (Render 무료 서버 기동 시간 포함)
    ai: 150000,         // AI 요청: BE의 AI 요청 제한(135초)보다 조금 길게
    save: 90000,        // 일기 확정·그림 업로드
    auth: 20000,        // 로그인·회원가입·로그아웃
    slow: 8000,         // 이 시간이 지나면 서버 준비 중 안내
  }, CFG.TIMEOUT_MS || {});
  const AI_TIMEOUT = TMO.ai, SAVE_TIMEOUT = TMO.save;
  const MAX_DRAWING = 10 * 1024 * 1024;   // BE 그림 업로드 상한 10 MiB

  const WD = ['일','월','화','수','목','금','토'];
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const pad = n => String(n).padStart(2,'0');
  const ymKey = (y,m) => `${y}-${pad(m)}`;
  // BE는 일기 날짜를 서울 시간(Asia/Seoul) 기준으로 정하므로 "오늘"도 서울 기준
  function seoulToday(){
    const p = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
    const g = t => +p.find(x => x.type === t).value;
    return {y:g('year'), m:g('month'), d:g('day')};
  }
  let today = seoulToday();
  const isToday = (y,m,d) => y === today.y && m === today.m && d === today.d;
  const fmtDate = (y,m,d) => `${y}. ${m}. ${d}. (${WD[new Date(y, m-1, d).getDay()]})`;
  // 요청 ID: ASCII 영문·숫자·하이픈, 128자 이내. 한 번 만든 ID는 같은 요청의 재시도에 그대로 씀
  function rid(prefix){
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    return prefix + '-' + Array.from(b, x => x.toString(16).padStart(2,'0')).join('');
  }

  // ---- 로그인 (Supabase Auth) ----
  const sb = (window.supabase && CFG.SUPABASE_URL && CFG.SUPABASE_PUBLISHABLE_KEY)
    ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true, autoRefreshToken:true}})
    : null;
  const NO_AUTH_MSG = '로그인 설정이 없어요. (config.js 확인)';
  let user = null;
  const userName = () => (user && user.user_metadata && user.user_metadata.name) || '';

  // ---- BE 요청 ----
  class ApiError extends Error {
    constructor(status, code, message, retryable){ super(message || code); this.status = status; this.code = code; this.retryable = retryable; }
  }
  // 마감 시각까지만 기다림: 넘으면 요청 중단 후 status 0 오류 (code: 단계별 TIMEOUT / AUTH_TIMEOUT)
  function untilDeadline(p, deadline, code, ctl){
    const pr = Promise.resolve(p); pr.catch(()=>{});   // 마감 뒤 늦은 실패는 무시
    const left = deadline - Date.now();
    if(left <= 0){ ctl && ctl.abort(); return Promise.reject(new ApiError(0, code, '', true)); }
    let t;
    return Promise.race([pr, new Promise((_, rej)=>{ t = setTimeout(()=>{ rej(new ApiError(0, code, '', true)); ctl && ctl.abort(); }, left); })])   // 시간 초과 먼저 확정 후 중단
      .finally(()=> clearTimeout(t));
  }
  // 서버 준비 상태: Render 무료 서버는 잠들어 있으면 첫 응답까지 오래 걸림
  let serverReady = false;
  function wakeServer(){
    if(!API_BASE) return;
    const ctl = new AbortController(), t = setTimeout(()=> ctl.abort(), TMO.request);
    fetch(API_BASE + '/health', {cache:'no-store', signal:ctl.signal})
      .then(r => { if(r.ok) serverReady = true; }).catch(()=>{}).finally(()=> clearTimeout(t));
  }
  function slowNotice(){
    toast(serverReady ? '응답 대기 중 · 잠시만 기다려 주세요' : '서버 준비 중 · 최대 1분 정도 걸려요', 6000);
  }
  async function accessToken(){
    if(!sb) return null;
    const {data} = await sb.auth.getSession();
    return data && data.session ? data.session.access_token : null;
  }
  // 모든 요청에 Authorization: Bearer <access token>. 401이면 토큰을 한 번 갱신해 같은 요청(같은 요청 ID)으로 다시 보냄
  // (BE는 인증을 세션 예약보다 먼저 확인하므로 같은 ID 재전송이 안전함)
  // 제한시간은 세션 조회 → 요청 → (401이면 갱신·재요청) → 응답 본문 읽기 전체에 한 번만 적용. 자동 재시도 없음
  async function api(path, {method = 'GET', json, form, headers = {}, timeout = TMO.request} = {}){
    const deadline = Date.now() + timeout, ctl = new AbortController();
    const slow = setTimeout(slowNotice, TMO.slow);
    const send = tk => {
      const h = Object.assign({Authorization: 'Bearer ' + tk}, headers);
      let body;
      if(json !== undefined){ h['Content-Type'] = 'application/json'; body = JSON.stringify(json); }
      else if(form) body = form;               // FormData: Content-Type(boundary)은 브라우저가 지정
      const req = fetch(API_BASE + path, {method, headers:h, body, signal:ctl.signal, cache:'no-store'})
        .catch(e => { throw new ApiError(0, e.name === 'AbortError' ? 'TIMEOUT' : 'NETWORK', '', true); });
      return untilDeadline(req, deadline, 'TIMEOUT', ctl);
    };
    try{
      const tk = await untilDeadline(accessToken(), deadline, 'AUTH_TIMEOUT');
      if(!tk) throw new ApiError(401, 'NO_SESSION', '', false);
      let res = await send(tk);
      if(res.status === 401 && sb){
        const {data} = await untilDeadline(sb.auth.refreshSession(), deadline, 'AUTH_TIMEOUT');
        if(data && data.session) res = await send(data.session.access_token);
      }
      serverReady = true;                      // 응답 헤더 도착 = 서버 깨어 있음
      let data = null, bad = false;
      try{ data = await untilDeadline(res.json(), deadline, 'TIMEOUT', ctl); }   // 본문 읽기도 제한시간 안
      catch(e){
        if(e instanceof ApiError) throw e;
        if(e && e.name === 'AbortError') throw new ApiError(0, 'TIMEOUT', '', true);
        bad = true;
      }
      if(!res.ok){
        const er = (data && data.error) || {};
        throw new ApiError(res.status, er.code || 'HTTP_' + res.status, er.message || '', !!er.retryable);
      }
      if(bad || data == null) throw new ApiError(res.status, 'INVALID_RESPONSE', '', true);   // 결과 불명: 같은 ID로만 재시도
      return data;
    }catch(e){
      throw e instanceof ApiError ? e : new ApiError(0, 'NETWORK', '', true);
    }finally{
      clearTimeout(slow);
    }
  }
  // 오류를 짧은 문구로
  function errText(e, fallback){
    const c = (e && e.code) || '';
    if(c === 'NETWORK') return serverReady ? '서버 연결 실패' : '서버 연결 실패 · 잠시 후 다시 시도';
    if(c === 'TIMEOUT') return serverReady ? '응답 시간 초과' : '서버 준비 중 · 잠시 후 다시 시도';
    if(c === 'AUTH_TIMEOUT') return '인증 응답 지연';
    if(c === 'INVALID_RESPONSE') return '응답 형식 오류';
    if(e.status === 401 || e.status === 403) return '인증 실패';
    const known = {
      SESSION_NOT_FOUND:'세션 없음', DIARY_NOT_FOUND:'일기 없음', DIARY_DRAFT_NOT_FOUND:'초안 없음',
      REQUEST_IN_PROGRESS:'요청 처리 중', SESSION_BUSY:'요청 처리 중', IDEMPOTENCY_CONFLICT:'요청 ID 충돌',
      DIARY_DATE_CONFLICT:'오늘 일기가 이미 있어요', HISTORY_REVISION_CONFLICT:'대화 버전 충돌',
      NO_CHILD_MESSAGES:'대화 내용 없음', CONVERSATION_LIMIT_REACHED:'대화 길이 초과',
      AI_OUTCOME_UNKNOWN:'결과 불명', DRAWING_ALREADY_EXISTS:'이미 저장된 그림', DRAWING_TOO_LARGE:'그림 크기 초과', DRAWING_DIMENSIONS_EXCEEDED:'그림 크기 초과',
      DRAWING_INVALID_IMAGE:'그림 형식 오류',
    };
    if(known[c]) return known[c];
    if(c.startsWith('AI_')) return 'AI 응답 실패';
    if(c.startsWith('AUTH_')) return '인증 실패';
    if(c.startsWith('DIARY_STORAGE') || c.startsWith('DRAWING_')) return '저장 실패';
    if(e.status === 422) return '입력 형식 오류';
    return fallback || '요청 실패';
  }
  // 같은 요청 ID로 다시 보내는 것이 의미 있는 실패 (결과를 모름 / 재시도 가능 / 인증·처리 중)
  // AI 결과 불명: 같은 ID 재전송은 캐시된 실패만 돌려받고, 새 ID 재전송은 금지 (AI 중복 호출 방지)
  const outcomeUnknown = e => !!e && e.code === 'AI_OUTCOME_UNKNOWN';
  const sameIdRetry = e => !outcomeUnknown(e) && (e.status === 0 || e.retryable || e.status === 401 || e.status === 403) ||
    ['REQUEST_IN_PROGRESS','SESSION_BUSY'].includes(e.code) || (e.code || '').startsWith('AUTH_');
  // 인증이 풀렸으면 로그인 창을 띄움
  function handleAuth(e){
    if(e && (e.status === 401 || e.status === 403)){ toast('인증 실패: 다시 로그인해 주세요'); if(auth.hidden) openAuth('login', null); }
  }

  // ---- 월별 일기 목록 (GET /api/diaries?month=YYYY-MM) ----
  const months = {};   // 'YYYY-MM' → {state:'loading'|'ok'|'err', byDay:{일: {diary_id, diary_date, weather, preview}}, promise}
  function loadMonth(y, m, force){
    const k = ymKey(y, m);
    if(!user) return Promise.resolve(null);
    if(months[k] && !force && months[k].state !== 'err') return months[k].promise;
    const uid = user.id, entry = months[k] = {state:'loading', byDay:{}, promise:null};
    refreshMonthViews(y, m);
    entry.promise = api('/api/diaries?month=' + k).then(r => {
      if(months[k] !== entry || !user || user.id !== uid) return null;    // 그 사이 다시 불러왔거나 로그아웃
      (r.diaries || []).forEach(it => { entry.byDay[+String(it.diary_date).slice(8, 10)] = it; });
      entry.state = 'ok'; refreshMonthViews(y, m);
      return entry;
    }).catch(e => {
      if(months[k] !== entry) return null;
      entry.state = 'err'; refreshMonthViews(y, m);
      toast('일기 목록: ' + errText(e)); handleAuth(e);
      return null;
    });
    return entry.promise;
  }
  const dayItem = (y, m, d) => { const mo = months[ymKey(y, m)]; return mo ? mo.byDay[d] || null : null; };
  // 확정 저장 응답을 목록에도 반영
  function putDiaryItem(det){
    const [y, m, d] = String(det.diary_date).split('-').map(Number), mo = months[ymKey(y, m)];
    if(mo && mo.state === 'ok'){
      mo.byDay[d] = {diary_id: det.diary_id, diary_date: det.diary_date, weather: det.weather, preview: (det.confirmed_text || '').slice(0, 120)};
      refreshMonthViews(y, m);
    } else loadMonth(y, m, true);
  }

  // ---- 책 표지 색: 책장에 꽂힌 책들의 색 (BE 일기는 일기 ID로 항상 같은 색) ----
  const SHELF_COLORS = ['color-jobs-3','color-connect','white','color-learn','ink','color-inspire-3','color-learn-3'];
  const randomColor = () => SHELF_COLORS[Math.floor(Math.random() * SHELF_COLORS.length)];
  function colorOf(id){ let h = 0; for(const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return SHELF_COLORS[h % SHELF_COLORS.length]; }
  let bookColor = SHELF_COLORS[0];
  function setCover(color){
    bookColor = color;
    book.style.setProperty('--cover', `var(--${color})`);
    book.style.setProperty('--cover-ink', color === 'ink' ? 'var(--white)' : 'var(--ink)');
  }

  // ---- 책: 대화(오늘) 또는 그림일기 보기 ----
  const shelf = document.getElementById('shelf');
  const reader = document.getElementById('reader'), book = document.getElementById('book');
  const messages = document.getElementById('messages');
  const composer = document.getElementById('composer'), input = document.getElementById('chatInput'), sendBtn = document.getElementById('sendBtn');
  const chatTitle = document.getElementById('chatTitle'), chatDate = document.getElementById('chatDate');
  const comic = document.getElementById('comic');
  const narrow = window.matchMedia('(max-width:700px), (max-aspect-ratio:1/1)');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [], bookMode = 'chat', bookOpener = null, reviewing = false;
  const later = (fn, ms) => timers.push(setTimeout(fn, reduce ? 0 : ms));

  // 책이 덮이는 중(closing)에는 화면을 막지 않음: 덮이는 애니메이션은 계속되지만 터치는 아래(방/달력)로 바로 전달되고,
  // 그 사이에 다른 책을 열면 덮던 것을 멈추고 새로 연다
  const bookShown = () => !reader.hidden && !reader.classList.contains('closing');
  // review: 저장 전 일기 초안 확인 (그림일기 양식에 초안·그림·날씨를 보여 주고 저장 버튼을 둠)
  function openBook(mode, dateText, opener, color, bk, review){
    if(bookShown()) return;
    timers.forEach(clearTimeout); timers = [];
    reader.classList.remove('closing');
    bookMode = mode; bookOpener = opener; reviewing = !!review;
    setCover(color || randomColor());
    book.className = 'book' + (mode === 'diary' ? ' readonly' : '');
    setupPages(mode === 'diary');
    resetEnd();
    logBtn.hidden = mode !== 'diary' || reviewing;   // 그림일기에서는 항상 대화 기록을 볼 수 있음 (기록이 없으면 없다고 표시)
    saveBtn.hidden = !reviewing; redrawBtn.hidden = !reviewing;
    chatTitle.textContent = mode === 'diary' ? '그림일기' : 'AI와 대화';
    chatDate.textContent = dateText;
    document.getElementById('coverDate').textContent = dateText;
    renderEntries(mode, bk);
    if(reviewing) renderReview();
    reader.hidden = false;
    if(mode === 'diary') paginate();                 // 책이 화면에 놓인 뒤에야 줄 수를 잴 수 있음
    requestAnimationFrame(()=>{ reader.classList.add('show');
      later(()=> book.classList.add('open'), 200);                                          // 표지가 넘어가며 책이 펼쳐짐
      later(()=>{ book.classList.add('ready'); if(mode === 'chat') input.focus({preventScroll:true}); else { pageNav.classList.add('show'); } }, 1100);  // 오른쪽 페이지 내용이 나타남
    });
  }
  function closeBook(after){
    if(!bookShown()) return;
    timers.forEach(clearTimeout); timers = [];
    reader.classList.add('closing');
    book.classList.remove('ready'); pageNav.classList.remove('show');
    const delay = spread > 0 ? 700 : 0;                    // 넘긴 쪽이 있으면 먼저 처음으로 되돌린 뒤
    if(spread > 0) goSpread(0);
    later(()=> book.classList.remove('open'), 200 + delay);        // 책을 다시 덮고
    later(()=> reader.classList.remove('show'), 1000 + delay);
    later(()=>{ reader.hidden = true; reader.classList.remove('closing'); pageNav.hidden = true; clearLeaves(); reviewing = false; after ? after() : (bookOpener && bookOpener.focus({preventScroll:true})); }, 1300 + delay);
  }

  // ---- 그림일기: 넘길 수 있는 책 ----
  // PC: 두 쪽씩 펼침 / 휴대폰: 한 쪽씩
  let TOTAL = 2;   // 1쪽: 날짜·그림·일기 글 / 이어지는 글 쪽(긴 일기) / 끝 쪽: 4컷 만화. paginate()가 계산
  const pageNav = document.getElementById('pageNav'), pageInfo = document.getElementById('pageInfo');
  const prevBtn = document.getElementById('prevPage'), nextBtn = document.getElementById('nextPage');
  const pnoLeft = document.getElementById('pnoLeft'), pnoRight = document.getElementById('pnoRight');
  let spread = 0, turning = false, diaryOn = false;
  const perSpread = () => narrow.matches ? 1 : 2;
  const spreads = () => Math.ceil(TOTAL / perSpread());
  function pagesOf(i){ const [l, r] = narrow.matches ? [null, i+1] : [i*2+1, i*2+2]; return [l, r <= TOTAL ? r : null]; }   // 쪽 수가 홀수면 마지막 오른쪽은 빈 쪽
  const insideEl = book.querySelector('.inside'), pageEl = book.querySelector('.page');
  // 그림일기의 내용이 있는 쪽: 1쪽 = 날짜·그림·일기 글, 이어지는 글 쪽들, 끝 쪽 = 4컷 만화 (모두 줄 없는 종이)
  const PAGE_CONTENT = {1: document.getElementById('dp1'), 2: comic};
  // 긴 일기: 1쪽 밑줄 6줄을 넘친 글을 밑줄만 있는 쪽으로 이어 씀. 글자 수가 아니라 실제로 그려진 줄 수로 나눔
  // 이어지는 쪽은 같은 글을 앞쪽 줄 수만큼 위로 밀어 보여 줌 (같은 너비라 줄바꿈 위치가 1쪽과 똑같음)
  const FIRST_LINES = 6, dpMeasure = document.getElementById('dpMeasure');
  let contPages = [];
  function paginate(){
    const src = document.getElementById('dpGrid'), g = dpMeasure.firstElementChild;
    g.textContent = src.textContent;
    const lh = parseFloat(getComputedStyle(g).lineHeight);
    if(!lh || !dpMeasure.clientHeight) return;            // 책이 아직 화면에 없음: 책이 보일 때 다시 계산
    const lines = Math.round(g.scrollHeight / lh);
    const per = Math.max(1, Math.floor(dpMeasure.clientHeight / lh));
    const extra = Math.ceil(Math.max(0, lines - FIRST_LINES) / per);
    clearLeaves();
    contPages.forEach(el => el.remove());
    contPages = Array.from({length: extra}, (_, i)=>{
      const el = document.createElement('section'); el.className = 'dp1 dpn'; el.hidden = true; el.setAttribute('aria-hidden', 'true');
      const grid = document.createElement('div'); grid.className = 'dp1-grid' + (src.classList.contains('muted') ? ' muted' : '');
      grid.style.height = `calc(${per} * 10cqw)`;
      const t = document.createElement('div'); t.textContent = src.textContent; t.style.marginTop = `calc(${-(FIRST_LINES + i * per)} * 10cqw)`;
      grid.appendChild(t); el.appendChild(grid);
      return el;
    });
    Object.keys(PAGE_CONTENT).forEach(k => delete PAGE_CONTENT[k]);
    PAGE_CONTENT[1] = document.getElementById('dp1');
    contPages.forEach((el, i) => { PAGE_CONTENT[i + 2] = el; });
    TOTAL = extra + 2; PAGE_CONTENT[TOTAL] = comic;
    spread = Math.min(spread, spreads() - 1);
    showNumbers();
  }
  window.addEventListener('resize', ()=>{ if(diaryOn && bookShown()) paginate(); });
  // 지금 보이는 왼쪽/오른쪽 쪽을 그림. 내용이 있는 쪽이면 그 내용을 해당 쪽에 놓는다
  function showPages(l, r){
    pnoLeft.textContent = diaryOn && l ? l : ''; pnoRight.textContent = diaryOn && r ? r : '';
    book.classList.toggle('plain-left', diaryOn && l in PAGE_CONTENT);
    book.classList.toggle('plain-right', diaryOn && (!r || r in PAGE_CONTENT));   // 쪽 수가 홀수일 때 마지막 빈 쪽도 일기 종이
    if(!diaryOn) return;
    for(const [n, el] of Object.entries(PAGE_CONTENT)){
      if(l === +n) insideEl.appendChild(el); else if(r === +n) pageEl.appendChild(el);
      el.hidden = !(l === +n || r === +n);
    }
  }
  function showNav(){
    const [l, r] = pagesOf(spread);
    pageInfo.textContent = narrow.matches ? `${spread+1} / ${TOTAL}` : `${r ? `${l}–${r}` : l} / ${TOTAL}`;
    prevBtn.disabled = spread === 0; nextBtn.disabled = spread === spreads() - 1;
    prevBtn.hidden = nextBtn.hidden = spreads() === 1;   // PC는 두 쪽이 한 번에 다 보여서 넘길 쪽이 없음
  }
  function showNumbers(){ const [l, r] = pagesOf(spread); showPages(l, r); showNav(); }
  function clearLeaves(){ book.querySelectorAll('.leaf').forEach(l => l.remove()); turning = false; }
  function setupPages(on){
    diaryOn = on; spread = 0; clearLeaves();
    pageNav.hidden = !on; pageNav.classList.remove('show');
    showNumbers();
  }
  function makeLeaf(front, back, turned){
    const leaf = document.createElement('div'); leaf.className = 'leaf' + (turned ? ' turned' : '');
    leaf.innerHTML = `<div class="lf"><span class="pno">${front ?? ''}</span></div><div class="lb"><span class="pno">${back ?? ''}</span></div>`;
    // 넘어가는 종이가 1쪽·2쪽이면 그 종이에도 같은 내용을 그려 둔다 (내려앉은 뒤 바뀌어 보이지 않도록)
    [[leaf.querySelector('.lf'), front], [leaf.querySelector('.lb'), back]].forEach(([face, n]) => {
      const src = PAGE_CONTENT[n]; if(!src) return;
      const c = src.cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
      c.hidden = false; c.classList.add('show'); face.classList.add('plain'); face.appendChild(c);
    });
    book.insertBefore(leaf, book.querySelector('.cover'));
    return leaf;
  }
  // 한 장을 넘기는 애니메이션: 넘어가는 종이를 만들고, 그 종이에 가려지는 쪽만 미리 바꿔 둔다.
  // 종이는 넘김(transform 전환)이 실제로 끝난 뒤에 지워서, 다 내려앉기 전에 화면이 바뀌어 보이지 않게 한다
  function goSpread(target){
    if(turning || target === spread || target < 0 || target >= spreads()) return;
    const fwd = target > spread, [l0, r0] = pagesOf(spread), [l1, r1] = pagesOf(target);
    turning = true;
    const leaf = fwd ? makeLeaf(r0, l1, false) : makeLeaf(r1, l0, true);
    if(fwd) showPages(l0, r1); else showPages(l1, r0);   // 앞으로: 오른쪽이 가려짐 / 뒤로: 왼쪽이 가려짐
    void leaf.offsetWidth;
    leaf.classList.toggle('turned', fwd);
    spread = target; showNav();
    let done = false;
    const finish = ()=>{ if(done) return; done = true; leaf.remove(); turning = false; showNumbers(); };
    leaf.addEventListener('transitionend', e=>{ if(e.target === leaf && e.propertyName === 'transform') finish(); });
    setTimeout(finish, reduce ? 0 : 1200);   // 전환 이벤트가 오지 않는 경우를 위한 대비
  }
  prevBtn.addEventListener('click', ()=> goSpread(spread - 1));
  nextBtn.addEventListener('click', ()=> goSpread(spread + 1));
  book.addEventListener('click', e=>{                 // 오른쪽 쪽을 누르면 다음, 왼쪽 쪽을 누르면 앞으로
    if(!diaryOn || !book.classList.contains('ready')) return;
    const r = book.getBoundingClientRect();
    if(e.clientX > r.left) goSpread(spread + 1); else goSpread(spread - 1);
  });
  document.addEventListener('keydown', e=>{
    if(!bookShown() || !diaryOn) return;
    if(e.key === 'ArrowRight') goSpread(spread + 1);
    if(e.key === 'ArrowLeft') goSpread(spread - 1);
  });

  // ---- 페이지에 내용 그리기 ----
  function addMsg(text, who){
    const el = document.createElement('div');
    el.className = 'msg ' + who; el.textContent = text;
    messages.appendChild(el);
    return el;
  }

  // ---- 날씨 (그림일기장 양식의 해·구름·눈·비). 키는 BE의 weather 값과 같음 ----
  const WEATHER = {
    sunny:  {label:'맑음', svg:'<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#222222" stroke-width="1.8" stroke-linecap="round"><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8"/></g><circle cx="12" cy="12" r="4.6" style="fill:var(--color-learn)" stroke="#222222" stroke-width="1.8"/></svg>'},
    cloudy: {label:'흐림', svg:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 19h11a4.2 4.2 0 0 0 .6-8.35A6 6 0 0 0 6.6 9.6 4.7 4.7 0 0 0 6.5 19z" style="fill:var(--color-jobs-3)" stroke="#222222" stroke-width="1.8" stroke-linejoin="round"/></svg>'},
    snowy:  {label:'눈', svg:'<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5"/><path d="M9.6 4.2 12 6.4l2.4-2.2M9.6 19.8 12 17.6l2.4 2.2M4.4 10.6l3.1-.9-.7-3.2M19.6 13.4l-3.1.9.7 3.2M4.4 13.4l3.1.9-.7 3.2M19.6 10.6l-3.1-.9.7-3.2"/></g></svg>'},
    rainy:  {label:'비', svg:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12.5a9.5 9.5 0 0 1 19 0z" style="fill:var(--color-connect)" stroke="#222222" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 3v1M12 12.5v6.3a2.2 2.2 0 0 1-4.4 0" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round"/></svg>'},
  };

  // ---- 그림일기 1쪽: 그림일기장 양식 (년 월 일 요일 / 날씨·이름 / 그림 칸 / 밑줄 칸) ----
  // bk: {weather, drawing(그림 주소), diary(일기 글), name, diaryId(그림 주소가 만료되면 다시 받아올 일기)}
  const dp1 = document.getElementById('dp1'), dpPic = document.getElementById('dpPic'), dpGrid = document.getElementById('dpGrid');
  const dpWeather = document.getElementById('dpWeather'), dpName = document.getElementById('dpName');
  Object.entries(WEATHER).forEach(([k, w])=>{
    const s = document.createElement('span'); s.className = 'wx'; s.dataset.w = k; s.title = w.label; s.innerHTML = w.svg; dpWeather.appendChild(s);
  });
  let diaryDate = new Date(today.y, today.m - 1, today.d);
  function renderDiaryPage(bk){
    const d = diaryDate;
    document.getElementById('dpY').textContent = d.getFullYear();
    document.getElementById('dpM').textContent = d.getMonth() + 1;
    document.getElementById('dpD').textContent = d.getDate();
    document.getElementById('dpW').textContent = WD[d.getDay()];
    const w = bk && WEATHER[bk.weather] ? bk.weather : null;
    dpWeather.querySelectorAll('.wx').forEach(s => s.classList.toggle('on', s.dataset.w === w));
    dpWeather.setAttribute('aria-label', '날씨: ' + (w ? WEATHER[w].label : '고르지 않음'));
    dpName.textContent = (bk && bk.name) || '';
    setPicture(bk);
    // 밑줄 칸: 일기 글을 줄 위에 씀 (대화 내용은 넣지 않음)
    setDiaryText((bk && bk.diary) || '', false);
  }
  function setDiaryText(text, muted){
    dpGrid.textContent = text; dpGrid.classList.toggle('muted', !!muted);
    dpGrid.setAttribute('aria-label', text ? '일기: ' + text : '일기 글 칸 (비어 있음)');
    if(diaryOn) paginate();
  }
  function setPicture(bk){
    dpPic.innerHTML = '';
    dpPic.classList.toggle('blank', !(bk && bk.drawing));
    if(!(bk && bk.drawing)) return;
    const img = new Image(); img.alt = '내가 그린 그림';
    // 비공개 그림 주소는 300초 뒤 만료됨: 못 불러오면 일기 상세를 다시 받아 새 주소로 한 번 바꿈
    img.addEventListener('error', async ()=>{
      if(!bk.diaryId || img.dataset.retried) return;
      img.dataset.retried = '1';
      try{ const det = await api('/api/diaries/' + encodeURIComponent(bk.diaryId)); if(det.imageUrl && img.isConnected) img.src = det.imageUrl; }catch(e){}
    });
    img.src = bk.drawing; dpPic.appendChild(img);
  }
  // 그림일기 2쪽: 4컷 만화. 아직 BE에서 만화가 오지 않으므로 점선 자리만 보임 (가짜 그림을 넣지 않음)
  function renderComic(bk){
    comic.innerHTML = '';
    const urls = (bk && bk.comic) || [];
    for(let i = 0; i < 4; i++){
      const p = document.createElement('div'); p.className = 'panel' + (urls[i] ? '' : ' blank');
      if(urls[i]){ const img = new Image(); img.src = urls[i]; img.alt = `4컷 만화 ${i+1}컷`; p.appendChild(img); }
      const n = document.createElement('b'); n.textContent = i + 1; p.appendChild(n);
      comic.appendChild(p);
    }
  }
  function renderEntries(mode, bk){
    messages.innerHTML = ''; dp1.hidden = true; comic.hidden = true;
    if(mode === 'diary'){                   // 그림일기: 1쪽 그림일기장 양식, 2쪽 4컷 만화
      renderDiaryPage(bk); renderComic(bk); showNumbers();
      return;
    }
    renderChat();
  }

  // ---- AI 대화 (BE 세션) ----
  // chat: {sessionId, revision(history_revision), startKey(Idempotency-Key), color, date,
  //        entries:[{who:'ai'|'user', text, id(client_message_id), state:'sent'|'pending'|'failed', err}], busy, note}
  let chat = null;
  function newChat(){
    chat = {sessionId:null, revision:0, startKey:rid('start'), color:randomColor(), date:ymKey(today.y, today.m) + '-' + pad(today.d),
            entries:[], busy:false, note:null};
    return chat;
  }
  const hasFailed = c => c.entries.some(en => en.state === 'failed');
  // 미해결 세션: 결과 불명 요청이 남아 있으면 새 발언·대화 종료·초안·저장 모두 차단
  const hasUnknown = c => !!c && c.entries.some(en => en.state === 'unknown');
  const UNKNOWN_BLOCK = '결과 불명 · 대화 진행 불가';
  function setComposer(){
    const c = chat, ok = !!(c && c.sessionId && !c.busy && !hasFailed(c) && !hasUnknown(c));
    sendBtn.disabled = !ok || !input.value.trim();
    endBtn.disabled = !!(c && c.busy);
  }
  function renderChat(){
    if(bookMode !== 'chat') return;
    const c = chat; messages.innerHTML = '';
    if(!c){ setComposer(); return; }
    c.entries.forEach(en => {
      const el = addMsg(en.text, en.who === 'user' ? 'user' : 'ai');
      if(en.state === 'pending') el.classList.add('sending');
      if(en.state === 'failed'){
        el.classList.add('failed');
        const row = document.createElement('div'); row.className = 'msg-fail';
        const t = document.createElement('span'); t.textContent = en.err || '전송 실패';
        const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = '다시 보내기';
        retry.addEventListener('click', ()=> sendMessage(en));            // 같은 client_message_id로 재전송
        const drop = document.createElement('button'); drop.type = 'button'; drop.textContent = '지우기';
        drop.addEventListener('click', ()=>{                               // 보내지 않기로 함: 글은 입력칸으로 되돌림
          c.entries.splice(c.entries.indexOf(en), 1);
          if(!input.value.trim()){ input.value = en.text; input.dispatchEvent(new Event('input')); }
          renderChat();
        });
        row.append(t, retry, drop); messages.appendChild(row);
      }
      if(en.state === 'unknown'){                    // 결과 불명: 요청 ID·본문·revision·세션 보존, 새 ID 재전송 없음
        el.classList.add('failed');
        const row = document.createElement('div'); row.className = 'msg-fail';
        const t = document.createElement('span'); t.textContent = UNKNOWN_BLOCK;
        const check = document.createElement('button'); check.type = 'button'; check.textContent = '같은 요청 확인';
        check.addEventListener('click', ()=> sendMessage(en));            // 같은 client_message_id·본문 (BE 캐시 응답, AI 재호출 없음)
        const fresh = document.createElement('button'); fresh.type = 'button';
        fresh.textContent = c.restartArmed ? '한 번 더 누르면 새 대화 (현재 대화 저장 안 됨)' : '새 대화 시작';
        fresh.addEventListener('click', ()=>{                              // 별도 선택: 두 번 눌러야 새 세션
          if(!c.restartArmed){
            c.restartArmed = true; renderChat();
            setTimeout(()=>{ if(c === chat && c.restartArmed){ c.restartArmed = false; renderChat(); } }, 3000);
            return;
          }
          restartChat();
        });
        row.append(t, check, fresh); messages.appendChild(row);
      }
    });
    if(c.busy){
      const typing = addMsg('', 'ai typing'); typing.innerHTML = '<i></i><i></i><i></i>'; typing.setAttribute('aria-label','AI가 답변을 작성하는 중');
    }
    if(c.note){
      const row = document.createElement('div'); row.className = 'chat-note';
      const t = document.createElement('span'); t.textContent = c.note.text; row.appendChild(t);
      if(c.note.action){ const b = document.createElement('button'); b.type = 'button'; b.textContent = c.note.label; b.addEventListener('click', c.note.action); row.appendChild(b); }
      messages.appendChild(row);
    }
    messages.scrollTop = messages.scrollHeight;
    setComposer();
  }
  // 세션이 사라졌을 때(BE 재시작 등): 새 대화로 다시 시작
  function restartChat(){
    flow = null; newChat(); renderChat(); updateShelf();
    if(bookShown() && bookMode === 'chat') startSession();
    else closeBook(()=> openChat());
  }
  // 채팅 시작: Idempotency-Key는 한 번 만들어 재시도에도 같은 값
  async function startSession(){
    const c = chat; if(!c || c.busy || c.sessionId) return;
    c.busy = true; c.note = null; renderChat();
    try{
      const r = await api('/api/chat-sessions', {method:'POST', json:{}, headers:{'Idempotency-Key': c.startKey}, timeout:AI_TIMEOUT});
      if(c !== chat) return;                       // 그 사이 로그아웃·새 대화 → 늦은 응답은 버림
      c.sessionId = r.session_id; c.revision = r.history_revision;
      c.entries.push({who:'ai', text:r.reply.text, state:'sent'});
    }catch(e){
      if(c !== chat) return;
      c.note = {text: errText(e, 'AI 응답 실패'), label: outcomeUnknown(e) ? '다시 확인' : '다시 시도', action: ()=> startSession()};   // 같은 Idempotency-Key
      handleAuth(e);
    }finally{

  async function sendMessage(entry){

    const wasUnknown = entry.state === 'unknown';   // 결과 불명 확인 요청: 실패해도 결과 불명 유지
    c.busy = true; c.note = null; c.restartArmed = false; entry.state = 'pending'; entry.err = null; renderChat();
    try{
      const r = await api(`/api/chat-sessions/${encodeURIComponent(c.sessionId)}/messages`,
        {method:'POST', json:{client_message_id: entry.id, text: entry.text}, timeout:AI_TIMEOUT});
      if(c !== chat || !c.entries.includes(entry)) return;
      entry.state = 'sent';
      if(r.history_revision >= c.revision){       // 늦게 도착한 이전 버전 응답은 화면을 덮어쓰지 않음
        c.revision = r.history_revision;

      if(c !== chat || !c.entries.includes(entry)) return;

        c.entries.splice(c.entries.indexOf(entry), 1);

      }else{                                       // 처리되지 않은 요청: 쓴 글은 입력칸에 보존

  const SK_COLORS = [['#222222','검정'],['#e8231a','빨강'],['#ff7a00','주황'],['#ffd000','노랑'],['#18a142','초록'],['#1665e8','파랑'],['#24298f','남색'],['#8a2be2','보라'],
                     ['#ffffff','흰색'],['#9e9e9e','회색'],['#8b5a2b','갈색'],['#ff8fb8','분홍'],['#7fd0ff','하늘색'],['#9be15d','연두'],['#ffd3b0','살구색'],['#c9a227','황토색']];

  const BRUSHES = {
    brush:       {label:'브러시'},
    calligraphy: {label:'서예 브러시'},
    airbrush:    {label:'에어브러시'},
    crayon:      {label:'크레용'},
    marker:      {label:'마커', layer:.45},
    pencil:      {label:'연필'},
    watercolor:  {label:'수채화 브러시', layer:.35},
  };
  let skColor = SK_COLORS[0][0], skSize = 12, skBrush = 'brush', skErase = false, skUndo = [], skDrawing = false, skLast = null, skDirty = false, skWeather = null;

  // 한 구간(a→b)을 브러시 모양대로 칠함. ctx는 그림판 또는 미리보기 캔버스
  function paintSeg(ctx, brush, a, b, color, size){
    ctx.save();
    ctx.strokeStyle = ctx.fillStyle = color; ctx.lineCap = ctx.lineJoin = 'round';
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), same = len < .01;
    const line = w => { ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0] + (same ? .01 : 0), b[1]); ctx.stroke(); };
    // 구간을 1~2px 간격으로 나눠 점을 찍는 브러시(크레용, 에어브러시)용
    const along = (step, fn) => { const n = Math.max(1, Math.ceil(len / step)); for(let i = 0; i <= n; i++){ const t = i / n; fn(a[0] + dx * t, a[1] + dy * t); } };
    switch(brush){
      case 'pencil':                        // 연필: 가늘고 살짝 연하게
        ctx.globalAlpha = .9; line(Math.max(1.5, size * .3)); break;
      case 'calligraphy': {                 // 서예 브러시: 45도로 기운 납작한 붓끝 → 긋는 방향에 따라 굵기가 달라짐
        const nx = Math.cos(Math.PI / 4) * size / 2, ny = -Math.sin(Math.PI / 4) * size / 2;
        ctx.beginPath();
        ctx.moveTo(a[0] + nx, a[1] + ny); ctx.lineTo(a[0] - nx, a[1] - ny); ctx.lineTo(b[0] - nx, b[1] - ny); ctx.lineTo(b[0] + nx, b[1] + ny);
        ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke(); break;

        spray(ctx, b, color, size); break;
      case 'crayon':                        // 크레용: 거친 결이 남는 촘촘한 점
        ctx.globalAlpha = .55;
        along(1.5, (x, y)=>{ for(let k = 0; k < size * .9; k++){ const r = size / 2 * Math.sqrt(Math.random()), t = Math.random() * Math.PI * 2; ctx.fillRect(x + Math.cos(t) * r, y + Math.sin(t) * r, 1.6, 1.6); } });
        break;

        ctx.shadowColor = color; ctx.shadowBlur = size * .6; line(size); break;
      default:                              // 브러시, 마커: 둥근 붓

  function spray(ctx, p, color, size){

  // 도구 버튼 만들기: 색, 브러시, 굵기, 날씨
  const skColorsEl = document.getElementById('skColors'), skEraser = document.getElementById('skEraser');

  function toggleBrushMenu(open){ skBrushMenu.hidden = !open; skBrushBtn.setAttribute('aria-expanded', String(open)); }

  // 굵기: 드래그하는 막대. 옆의 점은 그림판에 실제로 보이는 굵기

  function canvasBlob(){
